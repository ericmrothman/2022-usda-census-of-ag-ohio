<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ohio Agriculture Explorer — 2022 Census of Agriculture</title>
<meta name="description" content="An interactive explorer for the USDA 2022 Census
of Agriculture, Ohio: 2,300 measures across all 88 counties, as maps, rankings,
treemaps, waffles and more.">
<style>
/* ============================================================================
   Ohio Agriculture Explorer — design tokens and shell
   Palette per the reference data-viz instance (validated light + dark).
   ========================================================================== */

:root {
  color-scheme: light;

  --surface-1:      #fcfcfb;   /* chart surface */
  --plane:          #f4f4f1;   /* page plane */
  --panel:          #ffffff;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --border:         rgba(11, 11, 11, 0.10);
  --border-strong:  rgba(11, 11, 11, 0.18);
  --hover:          rgba(11, 11, 11, 0.05);
  --accent:         #2a78d6;
  --accent-ink:     #ffffff;
  --good:           #006300;
  --bad:            #d03b3b;

  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300;
  --series-7: #4a3aa7; --series-8: #e34948;

  --shadow: 0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.06);
  --radius: 10px;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --surface-1:      #1a1a19;
  --plane:          #0d0d0d;
  --panel:          #141413;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --grid:           #2c2c2a;
  --axis:           #383835;
  --border:         rgba(255, 255, 255, 0.10);
  --border-strong:  rgba(255, 255, 255, 0.20);
  --hover:          rgba(255, 255, 255, 0.06);
  --accent:         #3987e5;
  --accent-ink:     #0d0d0d;
  --good:           #0ca30c;
  --bad:            #e66767;

  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --series-4: #c98500; --series-5: #d55181; --series-6: #008300;
  --series-7: #9085e9; --series-8: #e66767;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  background: var(--plane);
  color: var(--text-primary);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

/* ------------------------------------------------------------------ layout */

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 332px 1fr;
  grid-template-areas: "head head" "side main";
  height: 100vh;
}

header {
  grid-area: head;
  display: flex; align-items: center; gap: 16px;
  padding: 0 18px; height: 56px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.brand .sub { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

.head-spacer { flex: 1; }

.head-actions { display: flex; gap: 6px; align-items: center; }

aside {
  grid-area: side;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overscroll-behavior: contain;
}

main {
  grid-area: main;
  display: flex; flex-direction: column;
  min-width: 0; min-height: 0;
  background: var(--plane);
}

/* ------------------------------------------------------------------ tabs */

.viewbar {
  display: flex; gap: 2px; padding: 8px 12px 0;
  overflow-x: auto; scrollbar-width: thin;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.viewbar button {
  border: 0; background: none; cursor: pointer;
  padding: 8px 11px 9px; border-radius: 7px 7px 0 0;
  color: var(--text-secondary); font-size: 13px; white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.viewbar button:hover { background: var(--hover); color: var(--text-primary); }
.viewbar button[aria-selected="true"] {
  color: var(--text-primary); font-weight: 600;
  border-bottom-color: var(--accent);
}

.canvas-wrap {
  flex: 1; min-height: 0; overflow: auto;
  padding: 18px; display: flex; flex-direction: column; gap: 14px;
}

.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px 18px;
}

.card h2 {
  margin: 0 0 2px; font-size: 14px; font-weight: 620;
  letter-spacing: -0.005em;
}
.card .caption {
  margin: 0 0 14px; font-size: 12px; color: var(--text-muted);
  line-height: 1.45; max-width: 78ch;
}

svg { display: block; max-width: 100%; }
svg.chart { margin-inline: auto; }
svg text { font-family: var(--sans); }

/* ------------------------------------------------------------- sidebar UI */

.group { border-bottom: 1px solid var(--border); }
.group > summary {
  list-style: none; cursor: pointer; user-select: none;
  padding: 11px 14px; font-size: 11px; font-weight: 660;
  letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-muted);
  display: flex; align-items: center; gap: 7px;
}
.group > summary::-webkit-details-marker { display: none; }
.group > summary:hover { color: var(--text-primary); background: var(--hover); }
.group > summary::before {
  content: ""; width: 5px; height: 5px; flex: none;
  border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg); transition: transform .15s;
}
.group[open] > summary::before { transform: rotate(45deg); }
.group .body { padding: 2px 14px 15px; display: flex; flex-direction: column; gap: 11px; }

label.field { display: flex; flex-direction: column; gap: 5px; }
label.field > span {
  font-size: 11px; color: var(--text-secondary); font-weight: 550;
}

input[type="text"], input[type="search"], select {
  width: 100%; padding: 7px 9px;
  background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border-strong); border-radius: 7px;
  outline: none;
}
input:focus-visible, select:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* segmented control */
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  flex: 1 1 auto; min-width: fit-content;
  padding: 6px 9px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface-1);
  color: var(--text-secondary); font-size: 12px; white-space: nowrap;
}
.seg button:hover { background: var(--hover); color: var(--text-primary); }
.seg button[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 600;
}

.btn {
  padding: 6px 11px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface-1);
  color: var(--text-secondary); font-size: 12px; white-space: nowrap;
}
.btn:hover { background: var(--hover); color: var(--text-primary); }
.btn.primary {
  background: var(--accent); border-color: var(--accent);
  color: var(--accent-ink); font-weight: 600;
}
.btn.sm { padding: 4px 8px; font-size: 11px; }

.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hint { font-size: 11px; color: var(--text-muted); line-height: 1.45; }

/* metric picker */
.picker { position: relative; }
.picker .current {
  width: 100%; text-align: left; cursor: pointer;
  padding: 8px 9px; border-radius: 7px; line-height: 1.35;
  border: 1px solid var(--border-strong); background: var(--surface-1);
}
.picker .current:hover { background: var(--hover); }
.picker .current .lab { font-size: 12.5px; font-weight: 560; display: block; }
.picker .current .ctx { font-size: 11px; color: var(--text-muted); display: block; margin-top: 2px; }

.results {
  position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 4px);
  max-height: 340px; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: 9px; box-shadow: var(--shadow); padding: 5px;
}
.results .opt {
  padding: 6px 8px; border-radius: 6px; cursor: pointer; line-height: 1.3;
}
.results .opt:hover, .results .opt.active { background: var(--hover); }
.results .opt .lab { font-size: 12.5px; }
.results .opt .ctx { font-size: 10.5px; color: var(--text-muted); }
.results .head {
  padding: 6px 8px 3px; font-size: 10px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-muted); font-weight: 650;
}

/* county chooser */
.county-list {
  max-height: 260px; overflow-y: auto; border: 1px solid var(--border);
  border-radius: 8px; padding: 4px; background: var(--surface-1);
}
.county-list .cty {
  display: flex; align-items: center; gap: 7px;
  padding: 3px 6px; border-radius: 5px; cursor: pointer; font-size: 12px;
}
.county-list .cty:hover { background: var(--hover); }
.county-list .cty input { accent-color: var(--accent); margin: 0; }
.county-list .cty .v { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: 11px; }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font-size: 11px; padding: 3px 8px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border-strong); background: var(--surface-1);
  color: var(--text-secondary);
}
.chip:hover { background: var(--hover); color: var(--text-primary); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* palette swatches */
.ramps { display: flex; flex-direction: column; gap: 4px; }
.ramp {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 4px 5px; border-radius: 7px; border: 1px solid transparent;
}
.ramp:hover { background: var(--hover); }
.ramp[aria-pressed="true"] { border-color: var(--accent); background: var(--hover); }
.ramp .bar { display: flex; height: 13px; flex: 1; border-radius: 3px; overflow: hidden; }
.ramp .bar i { flex: 1; }
.ramp .nm { font-size: 11px; color: var(--text-secondary); width: 62px; flex: none; }

/* ------------------------------------------------------------------ chart */

.axis-line { stroke: var(--axis); stroke-width: 1; }
.grid-line  { stroke: var(--grid); stroke-width: 1; }
.tick-text  { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.mark-label { fill: var(--text-secondary); font-size: 11px; }
.title-text { fill: var(--text-primary); font-size: 13px; font-weight: 600; }
.geo-stroke { stroke: var(--surface-1); stroke-width: 1.2; }
.no-data    { fill: var(--grid); }

.legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
.legend .item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-secondary); }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }

#tooltip {
  position: fixed; z-index: 90; pointer-events: none; opacity: 0;
  transition: opacity .1s;
  background: var(--panel); color: var(--text-primary);
  border: 1px solid var(--border-strong); border-radius: 8px;
  box-shadow: var(--shadow); padding: 8px 10px;
  font-size: 12px; line-height: 1.45; max-width: 300px;
}
#tooltip .t-name { font-weight: 640; margin-bottom: 3px; }
#tooltip .t-row { display: flex; gap: 12px; justify-content: space-between; }
#tooltip .t-row span:last-child { font-variant-numeric: tabular-nums; }
#tooltip .t-note { color: var(--text-muted); font-size: 11px; margin-top: 4px; }

/* ------------------------------------------------------------------ table */

table.data { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.data th, table.data td {
  text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.data th {
  position: sticky; top: 0; background: var(--surface-1); z-index: 2;
  font-weight: 620; color: var(--text-secondary); cursor: pointer;
}
table.data th:hover { color: var(--text-primary); }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tbody tr:hover { background: var(--hover); }

.scroll-x { overflow-x: auto; }
.empty {
  padding: 40px 20px; text-align: center; color: var(--text-muted);
  font-size: 13px; line-height: 1.6;
}

.stat-row { display: flex; flex-wrap: wrap; gap: 26px; margin-bottom: 4px; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat .k { font-size: 11px; color: var(--text-muted); }
.stat .v { font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.stat .v small { font-size: 12px; font-weight: 500; color: var(--text-muted); }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-areas: "head" "side" "main"; height: auto; }
  aside { max-height: 46vh; }
}

@media print {
  aside, header, .viewbar { display: none; }
  #app { display: block; }
  .card { break-inside: avoid; box-shadow: none; }
}

</style>
</head>

<script>
/* ============================================================================
   Data layer: the payload, lookups, and the transform engine that turns a
   raw metric into whatever the current normalisation asks for.
   ========================================================================== */

const DB = {
  counties: [],      // [{name, fips, lon, lat, area, col, row}]
  byName: new Map(),
  metrics: [],
  metricById: new Map(),
  values: {},        // id -> {year: [v x 88]}
  ohio: {},          // id -> {year: v}
  history: [],
  geo: null,
  grid: {cols: 12, rows: 12},
  presets: {},
  source: '',
};

/** Metric ids used by the derived normalisations, resolved once at load. */
const ANCHOR = {farms: null, landInFarms: null, landArea: null, sales: null};

function initDB(payload) {
  Object.assign(DB, payload);
  DB.byName = new Map(DB.counties.map((c, i) => [c.name, i]));
  DB.metricById = new Map(DB.metrics.map(m => [m.id, m]));

  const find = (label, ctx) => (DB.metrics.find(
    m => m.label === label && (!ctx || m.context.startsWith(ctx))) || {}).id || null;

  ANCHOR.farms       = find('Farms (number)', 'County Summary');
  ANCHOR.landInFarms = find('Land in farms (acres)', 'County Summary');
  ANCHOR.landArea    = find('Approximate land area (acres)');
  ANCHOR.sales       = find('Market value of agricultural products sold ($1,000)',
                            'County Summary');

  // Fall back to any table that carries the same measure.
  if (!ANCHOR.farms) ANCHOR.farms = find('Farms (number)');
  if (!ANCHOR.landInFarms) ANCHOR.landInFarms = find('Land in farms (acres)');
}

const N_COUNTIES = () => DB.counties.length;
const countyNames = () => DB.counties.map(c => c.name);

/** Raw values for a metric-year, or an array of nulls when unavailable. */
function rawSeries(metricId, year) {
  const v = DB.values[metricId];
  if (!v) return new Array(N_COUNTIES()).fill(null);
  if (v[year]) return v[year];
  return new Array(N_COUNTIES()).fill(null);
}

function ohioValue(metricId, year) {
  const o = DB.ohio[metricId];
  return o && o[year] != null ? o[year] : null;
}

/** Years a metric actually carries, newest last. */
function metricYears(metricId) {
  const m = DB.metricById.get(metricId);
  return m ? m.years : [];
}

function bestYear(metricId, wanted) {
  const ys = metricYears(metricId);
  if (!ys.length) return null;
  return ys.includes(wanted) ? wanted : ys[ys.length - 1];
}

/* -------------------------------------------------------------- statistics */

function finite(arr) { return arr.filter(v => v != null && isFinite(v)); }

function mean(arr) {
  const f = finite(arr);
  return f.length ? f.reduce((a, b) => a + b, 0) / f.length : null;
}

function stdev(arr) {
  const f = finite(arr);
  if (f.length < 2) return null;
  const mu = mean(f);
  return Math.sqrt(f.reduce((a, b) => a + (b - mu) ** 2, 0) / (f.length - 1));
}

function quantileSorted(sorted, p) {
  if (!sorted.length) return null;
  const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}

/** Pearson correlation over the positions where both series have values. */
function correlation(a, b) {
  let n = 0, sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
  for (let i = 0; i < a.length; i++) {
    const x = a[i], y = b[i];
    if (x == null || y == null || !isFinite(x) || !isFinite(y)) continue;
    n++; sa += x; sb += y; saa += x * x; sbb += y * y; sab += x * y;
  }
  if (n < 8) return null;
  const num = n * sab - sa * sb;
  const den = Math.sqrt((n * saa - sa * sa) * (n * sbb - sb * sb));
  return den === 0 ? null : num / den;
}

/** Gini coefficient of a non-negative distribution. */
function gini(values) {
  const f = finite(values).filter(v => v >= 0).sort((a, b) => a - b);
  const n = f.length;
  if (n < 2) return null;
  const total = f.reduce((a, b) => a + b, 0);
  if (total === 0) return 0;
  let cum = 0;
  for (let i = 0; i < n; i++) cum += (i + 1) * f[i];
  return (2 * cum) / (n * total) - (n + 1) / n;
}

/* ------------------------------------------------------- the transform core */

const MODES = [
  {id: 'raw',    label: 'Raw value',       desc: 'The number as published.'},
  {id: 'share',  label: '% of Ohio',       desc: 'Each county as a share of the state total for this measure.'},
  {id: 'perFarm', label: 'Per farm',       desc: 'Divided by the number of farms in the county.'},
  {id: 'perAcre', label: 'Per farm acre',  desc: 'Divided by the county’s land in farms.'},
  {id: 'density', label: 'Per 1,000 acres of land', desc: 'Divided by the county’s total land area — intensity, not size.'},
  {id: 'z',      label: 'Z-score',         desc: 'Standard deviations from the 88-county mean.'},
  {id: 'rank',   label: 'Rank (1 = highest)', desc: 'Position among the counties reporting a value.'},
  {id: 'lq',     label: 'Location quotient', desc:
    'Share of Ohio’s total for this measure ÷ share of Ohio’s farms. Above 1 means the county specialises in it.'},
];

const MODE_BY_ID = new Map(MODES.map(m => [m.id, m]));

/**
 * Build the series the charts actually draw.
 * Returns {values, unit, label, mode, year, note} where `values` is aligned to
 * DB.counties and holds null wherever the census withheld or omitted a figure.
 */
function series(metricId, year, mode) {
  const m = DB.metricById.get(metricId);
  if (!m) return {values: [], unit: '', label: '', note: ''};
  const y = bestYear(metricId, year);
  const base = rawSeries(metricId, y);
  const n = base.length;
  const out = new Array(n).fill(null);
  let unit = m.unit, note = '';

  const divide = (denomId, scale, unitLabel) => {
    const d = denomId ? rawSeries(denomId, bestYear(denomId, y)) : null;
    if (!d) return;
    for (let i = 0; i < n; i++) {
      if (base[i] == null || d[i] == null || d[i] === 0) continue;
      out[i] = base[i] / d[i] * scale;
    }
    unit = unitLabel;
  };

  switch (mode) {
    case 'share': {
      const total = ohioValue(metricId, y) ??
        finite(base).reduce((a, b) => a + b, 0);
      if (total) for (let i = 0; i < n; i++)
        if (base[i] != null) out[i] = base[i] / total * 100;
      unit = '% of Ohio';
      break;
    }
    case 'perFarm':
      divide(ANCHOR.farms, 1, `${m.unit || 'units'} per farm`);
      break;
    case 'perAcre':
      divide(ANCHOR.landInFarms, 1, `${m.unit || 'units'} per farm acre`);
      break;
    case 'density':
      divide(ANCHOR.landArea, 1000, `${m.unit || 'units'} per 1,000 acres`);
      break;
    case 'z': {
      const mu = mean(base), sd = stdev(base);
      if (sd) for (let i = 0; i < n; i++)
        if (base[i] != null) out[i] = (base[i] - mu) / sd;
      unit = 'z-score';
      break;
    }
    case 'rank': {
      const idx = base.map((v, i) => [v, i]).filter(d => d[0] != null)
        .sort((a, b) => b[0] - a[0]);
      idx.forEach((d, k) => { out[d[1]] = k + 1; });
      unit = 'rank';
      note = `${idx.length} counties reported a value.`;
      break;
    }
    case 'lq': {
      const farms = ANCHOR.farms ? rawSeries(ANCHOR.farms, bestYear(ANCHOR.farms, y)) : null;
      const totalM = ohioValue(metricId, y) ?? finite(base).reduce((a, b) => a + b, 0);
      const totalF = farms ? finite(farms).reduce((a, b) => a + b, 0) : 0;
      if (farms && totalM && totalF) {
        for (let i = 0; i < n; i++) {
          if (base[i] == null || farms[i] == null || farms[i] === 0) continue;
          out[i] = (base[i] / totalM) / (farms[i] / totalF);
        }
      }
      unit = 'location quotient';
      note = '1.0 = the county holds exactly its share of Ohio farms’ worth.';
      break;
    }
    default:
      for (let i = 0; i < n; i++) out[i] = base[i];
  }

  const suppressed = base.filter(v => v == null).length;
  if (suppressed) {
    note += `${note ? ' ' : ''}${suppressed} ${suppressed === 1 ? 'county is' : 'counties are'} ` +
            'blank — the census withholds figures that would identify an individual operation.';
  }
  return {values: out, unit, label: m.label, context: m.context, mode, year: y, note, metric: m};
}

/** 2017 → 2022 change for a metric, in absolute or percentage terms. */
function changeSeries(metricId, mode, pct) {
  const ys = metricYears(metricId);
  if (ys.length < 2) return null;
  const from = ys[0], to = ys[ys.length - 1];
  const a = series(metricId, from, mode).values;
  const b = series(metricId, to, mode).values;
  const out = new Array(a.length).fill(null);
  for (let i = 0; i < a.length; i++) {
    if (a[i] == null || b[i] == null) continue;
    if (pct) { if (a[i] !== 0) out[i] = (b[i] - a[i]) / Math.abs(a[i]) * 100; }
    else out[i] = b[i] - a[i];
  }
  return {values: out, from, to, pct,
          unit: pct ? '% change' : `change (${MODE_BY_ID.get(mode)?.id === 'raw'
            ? (DB.metricById.get(metricId).unit || '') : ''})`.trim()};
}

/* ---------------------------------------------------------------- formatting */

function fmtNumber(v, unit) {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  if (unit === 'rank') return String(Math.round(v));
  if (unit === 'z-score' || unit === 'location quotient') return v.toFixed(2);
  if (unit && unit.includes('%')) return `${v.toFixed(1)}%`;
  if (a >= 1e9) return `${(v / 1e9).toFixed(2)}B`;
  if (a >= 1e6) return `${(v / 1e6).toFixed(2)}M`;
  if (a >= 1e4) return Math.round(v).toLocaleString();
  if (a >= 100) return Math.round(v).toLocaleString();
  if (a >= 1) return v.toFixed(a >= 10 ? 1 : 2).replace(/\.0+$/, '');
  if (a === 0) return '0';
  return v.toPrecision(2);
}

function fmtFull(v, unit) {
  if (v == null || !isFinite(v)) return 'no data';
  const s = unit === 'rank' ? String(Math.round(v))
    : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString()
    : v.toLocaleString(undefined, {maximumFractionDigits: 2});
  return unit && !unit.includes('%') ? `${s} ${unit}` : s;
}

/**
 * Census dollar figures are printed in thousands, so "117,505 $1,000" is a
 * true but unreadable rendering of $117.5 million. Prose uses this instead.
 */
function fmtMoney(thousands) {
  if (thousands == null || !isFinite(thousands)) return '—';
  const d = thousands * 1000;
  const a = Math.abs(d);
  if (a >= 1e9) return `$${(d / 1e9).toFixed(2)} billion`;
  if (a >= 1e6) return `$${(d / 1e6).toFixed(1)} million`;
  if (a >= 1e3) return `$${Math.round(d / 1e3)},000`;
  return `$${Math.round(d).toLocaleString()}`;
}

/** "$1,000" is a scaling note in the census, not a currency symbol. */
function unitNote(unit) {
  if (unit === '$1,000') return 'reported in thousands of dollars';
  if (unit === 'cwt') return 'hundredweight';
  return '';
}


/* ============================================================================
   Colour and scale plumbing.

   Sequential ramps are single-hue light→dark; diverging ramps are a warm/cool
   pair around a neutral grey.  Both shapes are safe by construction, so the
   palette picker can only ever hand the charts a valid ramp.
   ========================================================================== */

const RAMPS = {
  blue:    {name: 'Blue',    light: ['#eaf2fd', '#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'],
                             dark:  ['#12243a', '#123b62', '#164f85', '#1c66ab', '#2a78d6', '#5598e7', '#86b6ef', '#cde2fb']},
  orange:  {name: 'Orange',  light: ['#fdeee7', '#fbd8c6', '#f6b795', '#f19365', '#eb6834', '#c94e1f', '#9e3c17', '#702a10'],
                             dark:  ['#3a1d0e', '#5c2c14', '#82401c', '#a95326', '#d95926', '#ea7c4b', '#f2a67e', '#fbd8c6']},
  teal:    {name: 'Teal',    light: ['#e4f7f0', '#c2ece0', '#8ed9c3', '#4fc4a2', '#1baf7a', '#149063', '#0e714d', '#095038'],
                             dark:  ['#0b2a21', '#0e4234', '#125c47', '#16785c', '#199e70', '#3cbb8e', '#74d3b0', '#c2ece0']},
  violet:  {name: 'Violet',  light: ['#eeecfa', '#d9d4f3', '#b9b0e8', '#8a7dd4', '#6155bf', '#4a3aa7', '#392c82', '#28205c'],
                             dark:  ['#1e1a3d', '#2d2560', '#3d3285', '#5245ab', '#6f61d4', '#9085e9', '#b5aef1', '#d9d4f3']},
  magenta: {name: 'Magenta', light: ['#fceef3', '#f8d5e2', '#f1b0c8', '#e87ba4', '#d55181', '#b23a64', '#8b2b4c', '#631d35'],
                             dark:  ['#3a1220', '#5a1d33', '#7d2947', '#a3375d', '#c74a76', '#e87ba4', '#f1b0c8', '#f8d5e2']},
  earth:   {name: 'Earth',   light: ['#f5f0e4', '#e8dcc0', '#d6c191', '#c0a263', '#a68544', '#876a34', '#6a5227', '#4a391a'],
                             dark:  ['#2a2214', '#42351f', '#5c4a2b', '#786138', '#9a7d47', '#bd9d61', '#d6c191', '#e8dcc0']},
  gray:    {name: 'Neutral', light: ['#f2f2ef', '#e1e0d9', '#c7c5bb', '#a8a69b', '#898781', '#6b6a65', '#52514e', '#333331'],
                             dark:  ['#242422', '#33332f', '#45443f', '#5a5952', '#727068', '#898781', '#a8a69b', '#c7c5bb']},
};

/** Diverging: two hues that read as opposite, neutral grey at the middle. */
const DIVERGING = {
  blueRed:    {name: 'Blue ↔ Red',    neg: 'blue',   pos: 'magenta'},
  tealOrange: {name: 'Teal ↔ Orange', neg: 'teal',   pos: 'orange'},
  violetEarth:{name: 'Violet ↔ Earth',neg: 'violet', pos: 'earth'},
};

const MIDPOINT = {light: '#f0efec', dark: '#383835'};

/**
 * Bivariate 3×3 matrices, indexed [rowB][colA] with the low class first.
 *
 * Mixing two arbitrary hues per pixel gives mud, so these are stated outright:
 * the light matrix is the well-travelled blue↔rose scheme, and the dark one is
 * its counterpart re-stepped so "low on both" sits nearest the dark surface
 * and "high on both" is the brightest corner.
 */
const BIVARIATE = {
  light: [
    ['#e8e8e8', '#b8d6d8', '#5ac8c8'],
    ['#dbb2d1', '#a5aec4', '#5698b9'],
    ['#c364a4', '#94619f', '#3b4994'],
  ],
  dark: [
    ['#2e2e2b', '#367274', '#3fb5bd'],
    ['#784464', '#7a809e', '#7cbcd6'],
    ['#c25a9e', '#be8fc7', '#b9c4f0'],
  ],
};
// Corner separation is validated all-pairs in both modes (worst CVD ΔE 8.7,
// worst normal-vision ΔE 15.5 on dark; 12.6 / 19.0 on light). The low-low
// corner sits under 3:1 against the surface on purpose — it means "least of
// both" and is meant to recede; the key, the worded tooltips and the table
// view are the relief.

const isDark = () => document.documentElement.dataset.theme === 'dark';
const rampSteps = key => RAMPS[key][isDark() ? 'dark' : 'light'];

/**
 * n colours from a single-hue ramp, running away from the chart surface.
 *
 * The dark ramps are ordered dark→light, so on a dark surface the low end sits
 * closest to the background. Starting the sample above the ramp's floor keeps
 * even the lowest class about 2:1 against the surface — without it the quiet
 * counties dissolve and the state loses its silhouette.
 */
function sequentialColors(key, n, reverse) {
  const steps = rampSteps(key);
  const floor = isDark() ? 0.28 : 0.06;
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.7 : i / (n - 1);
    out.push(sampleRamp(steps, floor + t * (0.97 - floor)));
  }
  return reverse ? out.reverse() : out;
}

/** n colours across a diverging pair, neutral in the middle. */
function divergingColors(key, n, reverse) {
  const {neg, pos} = DIVERGING[key];
  const mid = MIDPOINT[isDark() ? 'dark' : 'light'];
  const half = Math.floor(n / 2);
  const odd = n % 2 === 1;
  const negS = rampSteps(neg), posS = rampSteps(pos);
  const out = [];
  for (let i = 0; i < half; i++)
    out.push(sampleRamp(negS, 0.95 - (i / Math.max(1, half - 1)) * 0.55));
  if (odd) out.push(mid);
  for (let i = 0; i < half; i++)
    out.push(sampleRamp(posS, 0.40 + (i / Math.max(1, half - 1)) * 0.55));
  return reverse ? out.reverse() : out;
}

function sampleRamp(steps, t) {
  const x = Math.max(0, Math.min(1, t)) * (steps.length - 1);
  const i = Math.floor(x), f = x - i;
  if (i >= steps.length - 1) return steps[steps.length - 1];
  return mixHex(steps[i], steps[i + 1], f);
}

function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
  const g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
  const bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
  return `#${((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1)}`;
}

function relLuminance(hex) {
  const p = parseInt(hex.slice(1), 16);
  const ch = [(p >> 16) & 255, (p >> 8) & 255, p & 255].map(v => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}

/**
 * Ink that stays legible on a given fill — for labels printed inside marks.
 * Compares the actual contrast ratio against black and white rather than
 * guessing from lightness; mid-tone blues read far better with dark ink than
 * a naive lightness threshold suggests.
 */
function inkOn(hex) {
  if (!hex || hex[0] !== '#') return '#0b0b0b';
  const l = relLuminance(hex);
  const vsWhite = 1.05 / (l + 0.05);
  const vsBlack = (l + 0.05) / 0.05;
  return vsBlack >= vsWhite ? '#0b0b0b' : '#ffffff';
}

/** The eight-slot categorical theme, read from CSS so it follows the theme. */
function categorical(n) {
  const cs = getComputedStyle(document.documentElement);
  const out = [];
  for (let i = 1; i <= Math.min(n, 8); i++)
    out.push(cs.getPropertyValue(`--series-${i}`).trim());
  return out;
}

const cssVar = name => getComputedStyle(document.documentElement)
  .getPropertyValue(name).trim();

/* ------------------------------------------------------------- class breaks */

const BREAK_MODES = [
  {id: 'quantile', label: 'Equal count', desc: 'Each class holds the same number of counties — best for skewed data.'},
  {id: 'equal',    label: 'Equal range', desc: 'Classes of equal width across the value range.'},
  {id: 'jenks',    label: 'Natural breaks', desc: 'Class edges placed where the data has gaps.'},
  {id: 'log',      label: 'Log', desc: 'Equal ratios rather than equal amounts. Positive values only.'},
];

/**
 * Compute class edges. Returns {breaks, colors, classOf(v), min, max} where
 * `breaks` has colors.length - 1 interior edges.
 */
function makeClassScale(values, opts) {
  const {nClasses = 6, method = 'quantile', ramp = 'blue', diverging = false,
         divKey = 'blueRed', reverse = false, center = 0} = opts;
  const vals = finite(values);
  const colors = diverging
    ? divergingColors(divKey, nClasses, reverse)
    : sequentialColors(ramp, nClasses, reverse);

  if (!vals.length) return {breaks: [], colors, classOf: () => -1, min: 0, max: 0};

  const sorted = [...vals].sort((a, b) => a - b);
  const min = sorted[0], max = sorted[sorted.length - 1];
  let breaks = [];

  if (diverging) {
    // Symmetric around the centre so equal magnitudes get equal weight.
    const span = Math.max(Math.abs(min - center), Math.abs(max - center)) || 1;
    for (let i = 1; i < nClasses; i++)
      breaks.push(center - span + (2 * span) * (i / nClasses));
  } else if (method === 'equal') {
    for (let i = 1; i < nClasses; i++) breaks.push(min + (max - min) * i / nClasses);
  } else if (method === 'log') {
    const pos = sorted.filter(v => v > 0);
    const lo = pos.length ? pos[0] : 1, hi = max > 0 ? max : 1;
    for (let i = 1; i < nClasses; i++)
      breaks.push(Math.exp(Math.log(lo) + (Math.log(hi) - Math.log(lo)) * i / nClasses));
  } else if (method === 'jenks') {
    breaks = jenksBreaks(sorted, nClasses);
  } else {
    for (let i = 1; i < nClasses; i++) breaks.push(quantileSorted(sorted, i / nClasses));
  }
  // Strictly increasing edges, so heavily tied data still yields usable classes.
  for (let i = 1; i < breaks.length; i++)
    if (breaks[i] <= breaks[i - 1]) breaks[i] = breaks[i - 1] + 1e-9;

  const classOf = v => {
    if (v == null || !isFinite(v)) return -1;
    let k = 0;
    while (k < breaks.length && v >= breaks[k]) k++;
    return k;
  };
  return {breaks, colors, classOf, min, max, center, diverging};
}

/**
 * Fisher–Jenks, done on a sample when the series is large. 88 counties is
 * small enough to run exactly, so this stays cheap.
 */
function jenksBreaks(sorted, k) {
  const n = sorted.length;
  if (k >= n) return sorted.slice(1);
  const mat1 = [], mat2 = [];
  for (let i = 0; i <= n; i++) {
    mat1.push(new Array(k + 1).fill(0));
    mat2.push(new Array(k + 1).fill(Infinity));
  }
  for (let j = 1; j <= k; j++) { mat1[0][j] = 1; mat2[0][j] = 0; mat2[1][j] = 0; }
  for (let l = 2; l <= n; l++) {
    let s1 = 0, s2 = 0, w = 0;
    for (let m = 1; m <= l; m++) {
      const i3 = l - m + 1, val = sorted[i3 - 1];
      w++; s1 += val; s2 += val * val;
      const v = s2 - (s1 * s1) / w;
      const i4 = i3 - 1;
      if (i4 !== 0) {
        for (let j = 2; j <= k; j++) {
          if (mat2[l][j] >= v + mat2[i4][j - 1]) {
            mat1[l][j] = i3;
            mat2[l][j] = v + mat2[i4][j - 1];
          }
        }
      }
    }
    mat1[l][1] = 1; mat2[l][1] = s2 - (s1 * s1) / w;
  }
  const out = [];
  let kk = n;
  for (let j = k; j >= 2; j--) {
    const id = mat1[kk][j] - 1;
    out.unshift(sorted[id]);
    kk = mat1[kk][j] - 1;
  }
  return out;
}

/* --------------------------------------------------------------- axis ticks */

function niceTicks(min, max, count = 5) {
  if (!isFinite(min) || !isFinite(max)) return [];
  if (min === max) return [min];
  const span = max - min;
  const step0 = span / count;
  const mag = 10 ** Math.floor(Math.log10(step0));
  const norm = step0 / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step)
    out.push(Math.abs(v) < 1e-9 ? 0 : v);
  return out;
}

function linScale(d0, d1, r0, r1) {
  const span = d1 - d0 || 1;
  const f = v => r0 + (v - d0) / span * (r1 - r0);
  f.invert = p => d0 + (p - r0) / (r1 - r0) * span;
  f.domain = [d0, d1];
  f.range = [r0, r1];
  return f;
}


/* ============================================================================
   Application state, persistence, and small DOM/SVG helpers.
   ========================================================================== */

const STATE = {
  view: 'map',
  metric: null,          // primary metric id
  metric2: null,         // secondary, used by scatter / bivariate / compare
  year: '2022',
  mode: 'raw',           // one of MODES
  delta: false,          // draw 2017 → 2022 change instead of a level
  deltaPct: true,
  // colour
  ramp: 'blue',
  diverging: false,
  divKey: 'blueRed',
  reverse: false,
  nClasses: 6,
  breakMode: 'quantile',
  // county selection
  selected: null,        // Set of names, or null for "all"
  exclude: false,        // treat the selection as an exclusion list
  focus: null,           // county spotlighted by hover / click
  // display
  showLabels: false,
  showOhio: true,
  sortBy: 'value',
  topN: 0,               // 0 = no limit
  collections: {},       // user-saved county sets
};

const LS_KEY = 'ohio-ag-explorer/v1';

function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      collections: STATE.collections,
      theme: document.documentElement.dataset.theme,
    }));
  } catch (e) { /* private mode; not worth surfacing */ }
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (s.collections) STATE.collections = s.collections;
    if (s.theme) document.documentElement.dataset.theme = s.theme;
  } catch (e) { /* ignore */ }
}

/** Everything the charts draw is scoped to this list, in payload order. */
function activeCounties() {
  const all = DB.counties;
  if (!STATE.selected || STATE.selected.size === 0) return all.map((c, i) => i);
  const sel = STATE.selected;
  return all.map((c, i) => i)
    .filter(i => (STATE.exclude ? !sel.has(all[i].name) : sel.has(all[i].name)));
}

function activeNames() { return activeCounties().map(i => DB.counties[i].name); }

/**
 * Clicking a mark spotlights that county — it never changes which counties are
 * in play. Filtering is the sidebar's job, where the effect is visible and
 * reversible; a click on a chart that silently dropped a county from the data
 * was too easy to trigger by accident and too hard to undo.
 */
function spotlight(name) {
  STATE.focus = STATE.focus === name ? null : name;
  render();
}

/* ------------------------------------------------------------- DOM helpers */

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  applyAttrs(el, attrs);
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}

const SVG_NS = 'http://www.w3.org/2000/svg';

function s(tag, attrs = {}, ...kids) {
  const el = document.createElementNS(SVG_NS, tag);
  applyAttrs(el, attrs);
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}

function applyAttrs(el, attrs) {
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.setAttribute('class', v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function')
      el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
}

const $ = sel => document.querySelector(sel);
const clear = el => { while (el.firstChild) el.removeChild(el.firstChild); return el; };

/* ------------------------------------------------------------------ tooltip */

const TIP = {el: null};

function tipShow(evt, content) {
  if (!TIP.el) TIP.el = $('#tooltip');
  TIP.el.innerHTML = content;
  TIP.el.style.opacity = '1';
  tipMove(evt);
}

function tipMove(evt) {
  if (!TIP.el) return;
  const pad = 14, r = TIP.el.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - pad;
  TIP.el.style.left = `${Math.max(4, x)}px`;
  TIP.el.style.top = `${Math.max(4, y)}px`;
}

function tipHide() { if (TIP.el) TIP.el.style.opacity = '0'; }

/** Attach the standard hover behaviour to an SVG mark. */
function hoverable(el, contentFn) {
  el.addEventListener('mouseenter', e => tipShow(e, contentFn()));
  el.addEventListener('mousemove', tipMove);
  el.addEventListener('mouseleave', tipHide);
  el.setAttribute('tabindex', '0');
  el.addEventListener('focus', e => {
    const r = el.getBoundingClientRect();
    tipShow({clientX: r.left + r.width / 2, clientY: r.top}, contentFn());
  });
  el.addEventListener('blur', tipHide);
  return el;
}

function tipHTML(name, rows, note) {
  return `<div class="t-name">${esc(name)}</div>` +
    rows.map(([k, v]) => `<div class="t-row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('') +
    (note ? `<div class="t-note">${esc(note)}</div>` : '');
}

function esc(x) {
  return String(x).replace(/[&<>"']/g, c =>
    ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

/* -------------------------------------------------------------- chart frame */

/**
 * A chart card: heading, caption, an SVG sized to the container, and a slot
 * for the legend.  Every view builds on this so spacing stays consistent.
 */
function card(title, caption) {
  const svg = s('svg', {class: 'chart'});
  const legend = h('div', {class: 'legend'});
  const el = h('div', {class: 'card'},
    h('h2', {text: title}),
    caption ? h('p', {class: 'caption', text: caption}) : null,
    svg, legend);
  return {el, svg, legend};
}

function legendSwatches(container, entries) {
  clear(container);
  for (const [color, label] of entries) {
    container.append(h('div', {class: 'item'},
      h('span', {class: 'sw', style: {background: color}}),
      label));
  }
}

/** Ramp legend for a class scale, with the numeric edges printed. */
function legendClasses(container, scale, unit) {
  clear(container);
  const {colors, breaks} = scale;
  const wrap = h('div', {class: 'item', style: {gap: '0', alignItems: 'stretch', flexWrap: 'wrap'}});
  colors.forEach((c, i) => {
    const lo = i === 0 ? scale.min : breaks[i - 1];
    const hi = i === colors.length - 1 ? scale.max : breaks[i];
    const cell = h('div', {style: {display: 'flex', flexDirection: 'column', gap: '3px', minWidth: '54px'}},
      h('span', {style: {background: c, height: '10px', borderRadius: i === 0 ? '3px 0 0 3px'
        : i === colors.length - 1 ? '0 3px 3px 0' : '0', display: 'block'}}),
      h('span', {class: 'hint', style: {fontVariantNumeric: 'tabular-nums'},
        text: fmtNumber(lo, unit)}));
    wrap.append(cell);
  });
  container.append(wrap);
  if (unit) container.append(h('span', {class: 'hint', text: unit}));
}


/* ============================================================================
   Geographic views: choropleth, bivariate choropleth, and the tile cartogram.
   ========================================================================== */

/** Ohio-tuned equal-area conic — areas stay comparable, which a choropleth needs. */
function ohioPath(width, height) {
  const proj = d3.geoConicEqualArea()
    .parallels([39, 41.7])
    .rotate([82.7, 0])
    .fitSize([width, height], DB.geo);
  return {path: d3.geoPath(proj), proj};
}

/**
 * A hairline over the county edges. Without it the state loses its silhouette
 * wherever a class sits close to the surface colour — the palest classes on
 * light, the darkest on dark.
 */
function drawOutline(g, path) {
  for (const f of DB.geo.features) {
    g.append(s('path', {d: path(f), fill: 'none', stroke: cssVar('--axis'),
      'stroke-width': 0.5, opacity: 0.55, 'pointer-events': 'none'}));
  }
  // The spotlighted county gets a ring rather than a colour change, so the
  // value it encodes still reads correctly.
  if (STATE.focus) {
    const f = DB.geo.features.find(x => x.properties.name === STATE.focus);
    if (f) {
      g.append(s('path', {d: path(f), fill: 'none', stroke: cssVar('--surface-1'),
        'stroke-width': 4, 'pointer-events': 'none'}));
      g.append(s('path', {d: path(f), fill: 'none', stroke: cssVar('--text-primary'),
        'stroke-width': 2, 'pointer-events': 'none'}));
    }
  }
}

function currentSeries() {
  if (STATE.delta) {
    const ch = changeSeries(STATE.metric, STATE.mode, STATE.deltaPct);
    if (!ch) return null;
    const m = DB.metricById.get(STATE.metric);
    return {
      values: ch.values,
      unit: ch.pct ? '% change' : (STATE.mode === 'raw' ? m.unit : ''),
      label: m.label, context: m.context, metric: m,
      year: `${ch.from} → ${ch.to}`,
      note: `Change between the ${ch.from} and ${ch.to} censuses.`,
      isDelta: true,
    };
  }
  return series(STATE.metric, STATE.year, STATE.mode);
}

/** Values restricted to the active county set, others nulled out. */
function scopedValues(vals) {
  const keep = new Set(activeCounties());
  return vals.map((v, i) => (keep.has(i) ? v : null));
}

function scaleFor(vals) {
  const diverging = STATE.diverging || STATE.delta ||
    STATE.mode === 'z' || STATE.mode === 'lq';
  const center = STATE.mode === 'lq' && !STATE.delta ? 1 : 0;
  return makeClassScale(vals, {
    nClasses: STATE.nClasses, method: STATE.breakMode, ramp: STATE.ramp,
    diverging, divKey: STATE.divKey, reverse: STATE.reverse, center,
  });
}

function subtitleFor(ser) {
  const bits = [ser.context];
  if (ser.year) bits.push(ser.year);
  const m = MODE_BY_ID.get(STATE.mode);
  if (m && STATE.mode !== 'raw') bits.push(m.label);
  const un = unitNote(ser.metric ? ser.metric.unit : '');
  if (un && STATE.mode === 'raw') bits.push(un);
  return bits.filter(Boolean).join(' · ');
}

/* ------------------------------------------------------------------- choropleth */

function viewMap(root) {
  const ser = currentSeries();
  if (!ser) return root.append(noDeltaNotice());
  const vals = scopedValues(ser.values);
  const scale = scaleFor(vals);

  const c = card(ser.label, subtitleFor(ser) +
    (ser.note ? ' — ' + ser.note : ''));
  root.append(c.el);

  const W = Math.max(520, Math.min(1060, root.clientWidth - 72));
  const H = Math.round(W * 0.62);
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('width', W);
  c.svg.setAttribute('height', H);

  const {path} = ohioPath(W - 8, H - 8);
  const g = s('g', {transform: 'translate(4,4)'});
  c.svg.append(g);

  const active = new Set(activeCounties().map(i => DB.counties[i].name));

  for (const f of DB.geo.features) {
    const name = f.properties.name;
    const i = DB.byName.get(name);
    const v = vals[i];
    const inScope = active.has(name);
    const k = scale.classOf(v);
    const fill = k < 0 ? 'var(--grid)' : scale.colors[k];
    const shape = s('path', {
      d: path(f), fill,
      class: 'geo-stroke',
      opacity: inScope ? 1 : 0.14,
      style: {cursor: 'pointer'},
    });
    hoverable(shape, () => tipHTML(name, [
      [ser.label, fmtFull(v, ser.unit)],
      ...(v != null && !ser.isDelta && STATE.mode !== 'raw'
        ? [['Raw', fmtFull(rawSeries(STATE.metric, ser.year)[i], ser.metric.unit)]] : []),
    ], v == null ? 'No figure published for this county.' : ''));
    shape.addEventListener('click', () => spotlight(name));
    g.append(shape);
  }

  drawOutline(g, path);

  if (STATE.showLabels) {
    const {proj} = ohioPath(W - 8, H - 8);
    for (const cty of DB.counties) {
      if (!active.has(cty.name)) continue;
      const v = vals[DB.byName.get(cty.name)];
      if (v == null) continue;
      const p = proj([cty.lon, cty.lat]);
      if (!p) continue;
      const k = scale.classOf(v);
      g.append(s('text', {
        x: p[0], y: p[1] + 3, 'text-anchor': 'middle',
        'font-size': 9, 'font-weight': 600,
        fill: inkOn(k < 0 ? '#cccccc' : scale.colors[k]),
        'pointer-events': 'none',
        text: fmtNumber(v, ser.unit),
      }));
    }
  }

  legendClasses(c.legend, scale, ser.unit);
  root.append(statsCard(vals, ser));
}

/* --------------------------------------------------------- bivariate choropleth */

function viewBivariate(root) {
  if (!STATE.metric2) {
    root.append(h('div', {class: 'card'},
      h('div', {class: 'empty'},
        'Pick a second measure in the sidebar to compare two maps at once. ',
        h('br'),
        'Each county is shaded by where it falls on both — the 3×3 key shows how.')));
    return;
  }
  const a = series(STATE.metric, STATE.year, STATE.mode);
  const b = series(STATE.metric2, STATE.year, STATE.mode);
  const av = scopedValues(a.values), bv = scopedValues(b.values);

  const terc = arr => {
    const f = finite(arr).sort((x, y) => x - y);
    return [quantileSorted(f, 1 / 3), quantileSorted(f, 2 / 3)];
  };
  const [a1, a2] = terc(av), [b1, b2] = terc(bv);
  const cls = (v, t1, t2) => v == null ? -1 : v < t1 ? 0 : v < t2 ? 1 : 2;

  const grid = BIVARIATE[isDark() ? 'dark' : 'light'];

  const c = card(`${a.label}  ×  ${b.label}`,
    `Two measures on one map, ${STATE.year}. Each county is sorted into a third ` +
    `along each scale, and the 3×3 key names the nine combinations. Colour is ` +
    `doing two jobs here, so read it with the key — the ranked bars and the ` +
    `scatter carry the same pair of measures with one job each.`);
  root.append(c.el);
  c.el.insertBefore(h('div', {class: 'row', style: {margin: '0 0 12px'}},
    h('button', {class: 'btn sm', text: '⇄ Swap which measure is which axis',
      onclick: () => {
        const t = STATE.metric; STATE.metric = STATE.metric2; STATE.metric2 = t; render();
      }})), c.svg);

  const W = Math.max(520, Math.min(1060, root.clientWidth - 72));
  const H = Math.round(W * 0.62);
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);
  const {path} = ohioPath(W - 8, H - 8);
  const g = s('g', {transform: 'translate(4,4)'});
  c.svg.append(g);

  for (const f of DB.geo.features) {
    const name = f.properties.name, i = DB.byName.get(name);
    const ia = cls(av[i], a1, a2), ib = cls(bv[i], b1, b2);
    const fill = (ia < 0 || ib < 0) ? 'var(--grid)' : grid[ib][ia];
    const shape = s('path', {d: path(f), fill, class: 'geo-stroke', style: {cursor: 'pointer'}});
    const band = ['low', 'middle', 'high'];
    hoverable(shape, () => tipHTML(name, [
      [a.label, fmtFull(av[i], a.unit) + (ia >= 0 ? ` (${band[ia]})` : '')],
      [b.label, fmtFull(bv[i], b.unit) + (ib >= 0 ? ` (${band[ib]})` : '')],
    ]));
    shape.addEventListener('click', () => spotlight(name));
    g.append(shape);
  }
  drawOutline(g, path);

  // 3×3 key in the corner of the plot. The axes are named by short arrows;
  // the legend below the chart spells out the four corners in full.
  const cell = 26, side = 3 * (cell + 2);
  const kx = W - side - 30, ky = H - side - 34;
  const key = s('g', {transform: `translate(${kx},${ky})`});
  for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) {
    key.append(s('rect', {
      x: i * (cell + 2), y: (2 - j) * (cell + 2), width: cell, height: cell,
      fill: grid[j][i], rx: 2,
    }));
  }
  key.append(s('text', {
    x: 0, y: side + 14, class: 'tick-text',
    text: `${truncate(a.label.replace(/\s*\([^)]*\)$/, ''), 18)} →`,
  }));
  key.append(s('text', {
    x: -8, y: side, class: 'tick-text', 'text-anchor': 'start',
    transform: `rotate(-90,-8,${side})`,
    text: `${truncate(b.label.replace(/\s*\([^)]*\)$/, ''), 18)} →`,
  }));
  c.svg.append(key);

  legendSwatches(c.legend, [
    [grid[2][2], 'high on both'],
    [grid[0][2], `high ${truncate(a.label, 18)} only`],
    [grid[2][0], `high ${truncate(b.label, 18)} only`],
    [grid[0][0], 'low on both'],
  ]);
}

/* ---------------------------------------------------------- tile cartogram */

function viewGrid(root) {
  const ser = currentSeries();
  if (!ser) return root.append(noDeltaNotice());
  const vals = scopedValues(ser.values);
  const scale = scaleFor(vals);

  const c = card(`${ser.label} — every county the same size`,
    `${subtitleFor(ser)}. A choropleth lets big rural counties shout and small ` +
    `urban ones disappear; here each county is one equal tile, laid out to keep ` +
    `Ohio's rough geography.`);
  root.append(c.el);

  const cols = DB.grid.cols, rows = DB.grid.rows;
  const cell = 58, gap = 3;
  const W = cols * cell, H = rows * cell;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('width', Math.min(W, root.clientWidth - 60));

  const active = new Set(activeNames());
  for (const cty of DB.counties) {
    if (cty.col == null) continue;
    const i = DB.byName.get(cty.name), v = vals[i];
    const k = scale.classOf(v);
    const fill = k < 0 ? 'var(--grid)' : scale.colors[k];
    const x = cty.col * cell, y = cty.row * cell;
    const g = s('g', {style: {cursor: 'pointer'}, opacity: active.has(cty.name) ? 1 : 0.16});
    g.append(s('rect', {
      x: x + gap / 2, y: y + gap / 2, width: cell - gap, height: cell - gap,
      rx: 5, fill,
      stroke: STATE.focus === cty.name ? cssVar('--text-primary') : 'none',
      'stroke-width': 2,
    }));
    const ink = inkOn(k < 0 ? (isDark() ? '#2c2c2a' : '#e1e0d9') : scale.colors[k]);
    g.append(s('text', {
      x: x + cell / 2, y: y + cell / 2 - 3, 'text-anchor': 'middle',
      'font-size': 10, 'font-weight': 600, fill: ink, 'pointer-events': 'none',
      text: cty.name.length > 8 ? cty.name.slice(0, 7) + '…' : cty.name,
    }));
    g.append(s('text', {
      x: x + cell / 2, y: y + cell / 2 + 11, 'text-anchor': 'middle',
      'font-size': 10, fill: ink, opacity: 0.8, 'pointer-events': 'none',
      style: {fontVariantNumeric: 'tabular-nums'},
      text: fmtNumber(v, ser.unit),
    }));
    hoverable(g, () => tipHTML(cty.name, [[ser.label, fmtFull(v, ser.unit)]],
      v == null ? 'No figure published for this county.' : ''));
    g.addEventListener('click', () => spotlight(cty.name));
    c.svg.append(g);
  }
  legendClasses(c.legend, scale, ser.unit);
}

/* ------------------------------------------------------------------ helpers */

function truncate(str, n) {
  return str.length <= n ? str : str.slice(0, n - 1) + '…';
}

function noDeltaNotice() {
  const m = DB.metricById.get(STATE.metric);
  return h('div', {class: 'card'}, h('div', {class: 'empty'},
    `“${m ? m.label : 'This measure'}” was only collected for ` +
    `${m ? m.years.join(' and ') : 'one year'}, so there is no change to draw. ` +
    'Turn off "Change 2017 → 2022", or pick a measure the census ran twice.'));
}

/** Headline numbers for the current slice — the "is it even a chart" case. */
function statsCard(vals, ser) {
  const f = finite(vals);
  const sorted = [...f].sort((a, b) => a - b);
  const idx = vals.map((v, i) => [v, i]).filter(d => d[0] != null)
    .sort((a, b) => b[0] - a[0]);
  const top = idx[0], bot = idx[idx.length - 1];
  const g = gini(vals);

  const stat = (k, v, sub) => h('div', {class: 'stat'},
    h('span', {class: 'k', text: k}),
    h('span', {class: 'v'}, v, sub ? h('small', {text: ' ' + sub}) : null));

  const rows = [
    stat('Counties shown', String(f.length)),
    stat('Total', ser.isDelta || STATE.mode === 'rank' ? '—'
      : fmtNumber(f.reduce((a, b) => a + b, 0), ser.unit)),
    stat('Median', fmtNumber(quantileSorted(sorted, 0.5), ser.unit)),
    top ? stat('Highest', fmtNumber(top[0], ser.unit), DB.counties[top[1]].name) : null,
    bot ? stat('Lowest', fmtNumber(bot[0], ser.unit), DB.counties[bot[1]].name) : null,
  ];
  if (g != null && !ser.isDelta && STATE.mode === 'raw') {
    rows.push(stat('Concentration', g.toFixed(2), 'Gini'));
  }
  return h('div', {class: 'card'},
    h('div', {class: 'stat-row'}, rows.filter(Boolean)),
    g != null && !ser.isDelta && STATE.mode === 'raw'
      ? h('p', {class: 'caption', style: {margin: '10px 0 0'},
          text: `A Gini of ${g.toFixed(2)} means ${g < 0.3 ? 'this is spread fairly evenly across Ohio'
            : g < 0.6 ? 'this is moderately concentrated in some counties'
            : 'this is heavily concentrated in a handful of counties'}. ` +
            'See the Concentration view for the full curve.'})
      : null);
}


/* ============================================================================
   Magnitude and change: ranked bars, slope / dumbbell, and distribution.
   ========================================================================== */

/** [{i, name, v}] for the active counties, sorted and optionally truncated. */
function rows(ser) {
  const keep = activeCounties();
  let out = keep.map(i => ({i, name: DB.counties[i].name, v: ser.values[i]}));
  if (STATE.sortBy === 'name') out.sort((a, b) => a.name.localeCompare(b.name));
  else out.sort((a, b) => (b.v == null ? -Infinity : b.v) - (a.v == null ? -Infinity : a.v));
  if (STATE.topN > 0) out = out.slice(0, STATE.topN);
  return out;
}

/* ------------------------------------------------------------- ranked bars */

function viewRank(root) {
  const ser = currentSeries();
  if (!ser) return root.append(noDeltaNotice());
  const data = rows(ser);
  if (!data.length) return root.append(emptySelection());

  const c = card(ser.label, subtitleFor(ser) + (ser.note ? ' — ' + ser.note : ''));
  root.append(c.el);

  const W = Math.max(520, Math.min(1060, root.clientWidth - 72));
  const rowH = 19, padL = 108, padR = 66, padT = 26, padB = 8;
  const H = padT + data.length * rowH + padB;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);

  const vals = data.map(d => d.v);
  const lo = Math.min(0, ...finite(vals)), hi = Math.max(0, ...finite(vals));
  const x = linScale(lo, hi, padL, W - padR);
  const zero = x(0);
  const anyNeg = lo < 0;

  // A single measure is one series, so one colour — unless the values carry a
  // sign, where the diverging pair states direction.
  const posC = cssVar('--series-1');
  const negC = cssVar('--series-2');

  for (const t of niceTicks(lo, hi, 5)) {
    c.svg.append(s('line', {x1: x(t), x2: x(t), y1: padT - 6, y2: H - padB, class: 'grid-line'}));
    c.svg.append(s('text', {x: x(t), y: padT - 11, class: 'tick-text', 'text-anchor': 'middle',
      text: fmtNumber(t, ser.unit)}));
  }

  data.forEach((d, k) => {
    const y = padT + k * rowH;
    const bh = rowH - 5;                       // 2px surface gap top and bottom
    c.svg.append(s('text', {
      x: padL - 8, y: y + bh - 2, class: 'mark-label', 'text-anchor': 'end',
      text: truncate(d.name, 15),
    }));
    if (d.v == null) {
      c.svg.append(s('text', {x: zero + 4, y: y + bh - 2, class: 'tick-text',
        text: 'withheld', opacity: 0.7}));
      return;
    }
    const neg = d.v < 0;
    const x0 = neg ? x(d.v) : zero, x1 = neg ? zero : x(d.v);
    const w = Math.max(1, x1 - x0);
    const fill = anyNeg ? (neg ? negC : posC) : posC;
    const bar = s('rect', {
      x: x0, y: y + 1, width: w, height: bh, fill,
      rx: 4, ry: 4,
      opacity: STATE.focus && STATE.focus !== d.name ? 0.35 : 1,
      style: {cursor: 'pointer'},
    });
    hoverable(bar, () => tipHTML(d.name, [[ser.label, fmtFull(d.v, ser.unit)]]));
    bar.addEventListener('click', () => spotlight(d.name));
    c.svg.append(bar);
    c.svg.append(s('text', {
      x: neg ? x0 - 6 : x1 + 6, y: y + bh - 2, class: 'tick-text',
      'text-anchor': neg ? 'end' : 'start',
      text: fmtNumber(d.v, ser.unit),
    }));
  });

  if (anyNeg)
    c.svg.append(s('line', {x1: zero, x2: zero, y1: padT - 6, y2: H - padB, class: 'axis-line'}));

  if (anyNeg) legendSwatches(c.legend, [[posC, 'increase'], [negC, 'decrease']]);
  else clear(c.legend).append(h('span', {class: 'hint',
    text: ser.unit ? `Values in ${ser.unit}.` : ''}));
}

/* ------------------------------------------------- slope / dumbbell 2017-22 */

function viewChange(root) {
  const m = DB.metricById.get(STATE.metric);
  if (!m || m.years.length < 2) return root.append(noDeltaNotice());
  const from = m.years[0], to = m.years[m.years.length - 1];
  const a = series(STATE.metric, from, STATE.mode);
  const b = series(STATE.metric, to, STATE.mode);

  const keep = activeCounties();
  let data = keep.map(i => ({
    i, name: DB.counties[i].name, a: a.values[i], b: b.values[i],
  })).filter(d => d.a != null && d.b != null);
  data.sort((x, y) => (y.b - y.a) - (x.b - x.a));
  if (STATE.topN > 0) {
    // Keep the largest movers at both ends rather than one arbitrary end.
    const n = Math.max(2, Math.floor(STATE.topN / 2));
    data = [...data.slice(0, n), ...data.slice(-n)];
  }
  if (!data.length) return root.append(emptySelection());

  const modeNote = STATE.mode === 'raw' ? unitNote(m.unit)
    : MODE_BY_ID.get(STATE.mode).label;
  const c = card(`${m.label}: ${from} → ${to}`,
    [m.context, modeNote].filter(Boolean).join(' · ') +
    `. Each line is one county; its length is the change between the two ` +
    `censuses. Counties where either year was withheld are omitted.`);
  root.append(c.el);

  const W = Math.max(520, Math.min(1000, root.clientWidth - 72));
  const rowH = 17, padT = 34, padB = 26, padL = 108, padR = 108;
  const H = padT + data.length * rowH + padB;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);

  const all = data.flatMap(d => [d.a, d.b]);
  const lo = Math.min(...all), hi = Math.max(...all);
  const x = linScale(Math.min(0, lo), hi, padL, W - padR);

  const up = cssVar('--series-1'), down = cssVar('--series-2');

  for (const t of niceTicks(Math.min(0, lo), hi, 5)) {
    c.svg.append(s('line', {x1: x(t), x2: x(t), y1: padT - 8, y2: H - padB, class: 'grid-line'}));
    c.svg.append(s('text', {x: x(t), y: padT - 14, class: 'tick-text',
      'text-anchor': 'middle', text: fmtNumber(t, a.unit)}));
  }

  data.forEach((d, k) => {
    const y = padT + k * rowH + rowH / 2;
    const rise = d.b >= d.a;
    const col = rise ? up : down;
    c.svg.append(s('text', {x: padL - 10, y: y + 4, class: 'mark-label',
      'text-anchor': 'end', text: truncate(d.name, 15)}));
    c.svg.append(s('line', {
      x1: x(d.a), x2: x(d.b), y1: y, y2: y, stroke: col, 'stroke-width': 2,
      'stroke-linecap': 'round', opacity: 0.55,
    }));
    // Hollow start, solid end: the direction reads without relying on colour.
    c.svg.append(s('circle', {cx: x(d.a), cy: y, r: 4, fill: cssVar('--surface-1'),
      stroke: col, 'stroke-width': 2}));
    const end = s('circle', {cx: x(d.b), cy: y, r: 4.5, fill: col,
      stroke: cssVar('--surface-1'), 'stroke-width': 2, style: {cursor: 'pointer'}});
    const pct = d.a !== 0 ? ((d.b - d.a) / Math.abs(d.a) * 100) : null;
    hoverable(end, () => tipHTML(d.name, [
      [from, fmtFull(d.a, a.unit)],
      [to, fmtFull(d.b, b.unit)],
      ['Change', `${d.b - d.a >= 0 ? '+' : ''}${fmtNumber(d.b - d.a, a.unit)}` +
        (pct != null ? ` (${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%)` : '')],
    ]));
    end.addEventListener('click', () => spotlight(d.name));
    c.svg.append(end);
    c.svg.append(s('text', {
      x: W - padR + 10, y: y + 4, class: 'tick-text',
      fill: rise ? 'var(--good)' : 'var(--bad)',
      text: (pct == null ? '—' : `${pct >= 0 ? '+' : ''}${pct.toFixed(0)}%`),
    }));
  });

  legendSwatches(c.legend, [[up, `higher in ${to}`], [down, `lower in ${to}`]]);
  c.legend.append(h('span', {class: 'hint',
    text: `Hollow dot = ${from}, solid dot = ${to}.`}));
}

/* ------------------------------------------------------------ distribution */

function viewDistribution(root) {
  const ser = currentSeries();
  if (!ser) return root.append(noDeltaNotice());
  const keep = activeCounties();
  const data = keep.map(i => ({i, name: DB.counties[i].name, v: ser.values[i]}))
    .filter(d => d.v != null);
  if (data.length < 3) return root.append(emptySelection());

  const c = card(`How ${ser.label} is spread across counties`,
    `${subtitleFor(ser)}. Every county is one dot, nudged vertically only so ` +
    `they don't overlap — horizontal position is the value.`);
  root.append(c.el);

  const W = Math.max(520, Math.min(1060, root.clientWidth - 72));
  const H = 300, padL = 40, padR = 30, padT = 30, padB = 52;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);

  const vals = data.map(d => d.v);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const x = linScale(Math.min(lo, 0), hi, padL, W - padR);

  for (const t of niceTicks(Math.min(lo, 0), hi, 6)) {
    c.svg.append(s('line', {x1: x(t), x2: x(t), y1: padT, y2: H - padB, class: 'grid-line'}));
    c.svg.append(s('text', {x: x(t), y: H - padB + 16, class: 'tick-text',
      'text-anchor': 'middle', text: fmtNumber(t, ser.unit)}));
  }

  // quartile band behind the dots
  const sorted = [...vals].sort((p, q) => p - q);
  const q1 = quantileSorted(sorted, 0.25), med = quantileSorted(sorted, 0.5),
        q3 = quantileSorted(sorted, 0.75);
  c.svg.append(s('rect', {x: x(q1), y: padT, width: Math.max(1, x(q3) - x(q1)),
    height: H - padB - padT, fill: cssVar('--grid'), opacity: 0.55, rx: 4}));
  c.svg.append(s('line', {x1: x(med), x2: x(med), y1: padT, y2: H - padB,
    stroke: cssVar('--axis'), 'stroke-width': 2}));
  c.svg.append(s('text', {x: x(med), y: padT - 8, class: 'tick-text',
    'text-anchor': 'middle', text: `median ${fmtNumber(med, ser.unit)}`}));

  // beeswarm: place each dot at its value, stepping down when it would collide
  const r = 5, midY = (padT + H - padB) / 2;
  const placed = [];
  data.sort((p, q) => p.v - q.v).forEach(d => {
    const cx = x(d.v);
    let k = 0, cy = midY;
    while (placed.some(p => Math.abs(p.cx - cx) < r * 2 && Math.abs(p.cy - cy) < r * 2)) {
      k++;
      cy = midY + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (r * 2 + 1);
      if (Math.abs(cy - midY) > (H - padB - padT) / 2 - r) { cy = midY; break; }
    }
    placed.push({cx, cy});
    const dot = s('circle', {
      cx, cy, r, fill: cssVar('--series-1'),
      stroke: cssVar('--surface-1'), 'stroke-width': 2,
      opacity: STATE.focus && STATE.focus !== d.name ? 0.3 : 0.95,
      style: {cursor: 'pointer'},
    });
    hoverable(dot, () => tipHTML(d.name, [[ser.label, fmtFull(d.v, ser.unit)]]));
    dot.addEventListener('click', () => spotlight(d.name));
    c.svg.append(dot);
  });

  clear(c.legend).append(h('span', {class: 'hint',
    text: `Shaded band = the middle half of counties (${fmtNumber(q1, ser.unit)}` +
          ` to ${fmtNumber(q3, ser.unit)}). ${data.length} counties plotted.`}));
  root.append(statsCard(ser.values.map((v, i) =>
    keep.includes(i) ? v : null), ser));
}

function emptySelection() {
  return h('div', {class: 'card'}, h('div', {class: 'empty'},
    'No counties in the current selection. ',
    h('br'), 'Clear the county filter in the sidebar to bring them back.'));
}


/* ============================================================================
   Part-to-whole: treemap, waffle, donut — plus small multiples.

   All three answer "how is this total divided up?", so they share one data
   preparation step and differ only in how they draw it.
   ========================================================================== */

/**
 * Slices for a part-to-whole chart.
 *  - by 'county': the current measure split across counties
 *  - by 'metric': the current county (or all of Ohio) split across the
 *                 sibling measures that sit under the same heading
 */
function parts(by) {
  const ser = currentSeries();
  if (!ser || ser.isDelta) return null;

  if (by === 'metric') {
    const sibs = siblingMetrics(STATE.metric);
    if (sibs.length < 2) return null;
    const keep = activeCounties();
    const out = sibs.map(m => {
      const v = series(m.id, STATE.year, 'raw').values;
      const total = keep.reduce((acc, i) => acc + (v[i] ?? 0), 0);
      return {key: m.label.replace(/\s*\([^)]*\)$/, ''), v: total, metric: m};
    }).filter(d => d.v > 0);
    return {slices: out.sort((a, b) => b.v - a.v),
            unit: sibs[0].unit,
            title: `${DB.metricById.get(STATE.metric).context}`,
            caption: `The measures reported alongside “${ser.label}”, summed over ` +
                     `${describeSelection()} for ${STATE.year}.`};
  }

  const keep = activeCounties();
  const out = keep.map(i => ({key: DB.counties[i].name, v: ser.values[i], i}))
    .filter(d => d.v != null && d.v > 0)
    .sort((a, b) => b.v - a.v);
  return {slices: out, unit: ser.unit, title: ser.label,
          caption: `${subtitleFor(ser)}. Counties with no published figure, or a ` +
                   `value of zero, are not drawn.`};
}

/** Measures printed under the same heading of the same table. */
function siblingMetrics(metricId) {
  const m = DB.metricById.get(metricId);
  if (!m) return [];
  return DB.metrics.filter(o =>
    o.table_title === m.table_title && o.section === m.section &&
    o.unit === m.unit && o.years.includes(STATE.year));
}

/** Group the tail so no chart ever carries more than eight colour classes. */
function foldTail(slices, maxSlices) {
  if (slices.length <= maxSlices) return {shown: slices, folded: null};
  const shown = slices.slice(0, maxSlices - 1);
  const rest = slices.slice(maxSlices - 1);
  const folded = {key: `Other (${rest.length})`, v: rest.reduce((a, b) => a + b.v, 0), rest};
  return {shown: [...shown, folded], folded};
}

/* ------------------------------------------------------------------ treemap */

function viewTreemap(root) {
  const p = parts(STATE.partsBy || 'county');
  if (!p) return root.append(partsUnavailable());

  const c = card(`${p.title} — treemap`, p.caption +
    ' Each rectangle is sized by its share of the total.');
  root.append(c.el);

  const W = Math.max(520, Math.min(1060, root.clientWidth - 72));
  const H = Math.round(W * 0.58);
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);

  const total = p.slices.reduce((a, b) => a + b.v, 0);
  const rootNode = d3.hierarchy({children: p.slices})
    .sum(d => d.v)
    .sort((a, b) => b.value - a.value);
  d3.treemap().size([W, H]).paddingInner(2).round(true)(rootNode);

  // Sequential shading by share: the areas already encode magnitude, so the
  // ramp is here to bind the map and the treemap to one visual language.
  const scale = makeClassScale(p.slices.map(d => d.v), {
    nClasses: STATE.nClasses, method: STATE.breakMode, ramp: STATE.ramp,
    reverse: STATE.reverse,
  });

  for (const leaf of rootNode.leaves()) {
    const d = leaf.data;
    const w = leaf.x1 - leaf.x0, hgt = leaf.y1 - leaf.y0;
    if (w < 1 || hgt < 1) continue;
    const k = scale.classOf(d.v);
    const fill = scale.colors[Math.max(0, k)];
    const g = s('g', {style: {cursor: 'pointer'}});
    g.append(s('rect', {x: leaf.x0, y: leaf.y0, width: w, height: hgt,
      fill, rx: 3}));
    // Only label where the text actually fits — a clipped label is worse
    // than none, and the tooltip carries the value either way.
    const room = w - 12;
    if (room > 42 && hgt > 26) {
      const ink = inkOn(fill);
      g.append(s('text', {x: leaf.x0 + 6, y: leaf.y0 + 15, 'font-size': 11,
        'font-weight': 600, fill: ink, 'pointer-events': 'none',
        text: truncate(d.key, Math.floor(room / 6.2))}));
      const val = `${fmtNumber(d.v, p.unit)} · ${(d.v / total * 100).toFixed(1)}%`;
      if (hgt > 40 && val.length * 5.6 <= room)
        g.append(s('text', {x: leaf.x0 + 6, y: leaf.y0 + 29, 'font-size': 10,
          fill: ink, opacity: 0.85, 'pointer-events': 'none', text: val}));
    }
    hoverable(g, () => tipHTML(d.key, [
      ['Value', fmtFull(d.v, p.unit)],
      ['Share', `${(d.v / total * 100).toFixed(2)}%`],
    ]));
    if (d.i != null) g.addEventListener('click', () => spotlight(d.key));
    c.svg.append(g);
  }

  legendClasses(c.legend, scale, p.unit);
}

/* ------------------------------------------------------------------- waffle */

function viewWaffle(root) {
  const p = parts(STATE.partsBy || 'county');
  if (!p) return root.append(partsUnavailable());

  const {shown} = foldTail(p.slices, 8);
  const total = p.slices.reduce((a, b) => a + b.v, 0);
  const cols = 25, rowsN = 20, cells = cols * rowsN;   // 500 squares = 0.2% each

  const c = card(`${p.title} — waffle`, p.caption +
    ` Each of the ${cells} squares is ${(100 / cells).toFixed(1)}% of the total.`);
  root.append(c.el);

  const cell = 15, gap = 2;
  const W = cols * cell, H = rowsN * cell;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('width', Math.min(W * 1.6, root.clientWidth - 60));

  const colors = categorical(shown.length);
  // Largest-remainder allocation so the squares always sum to exactly `cells`.
  const exact = shown.map(d => d.v / total * cells);
  const counts = exact.map(Math.floor);
  let left = cells - counts.reduce((a, b) => a + b, 0);
  exact.map((e, i) => [e - counts[i], i]).sort((a, b) => b[0] - a[0])
    .forEach(([, i]) => { if (left-- > 0) counts[i]++; });

  let k = 0;
  shown.forEach((d, si) => {
    for (let n = 0; n < counts[si]; n++, k++) {
      const cx = k % cols, cy = Math.floor(k / cols);
      const rect = s('rect', {
        x: cx * cell + gap / 2, y: cy * cell + gap / 2,
        width: cell - gap, height: cell - gap, rx: 2,
        fill: colors[si % colors.length], style: {cursor: 'pointer'},
      });
      hoverable(rect, () => tipHTML(d.key, [
        ['Value', fmtFull(d.v, p.unit)],
        ['Share', `${(d.v / total * 100).toFixed(2)}%`],
        ['Squares', String(counts[si])],
      ]));
      c.svg.append(rect);
    }
  });

  legendSwatches(c.legend, shown.map((d, i) =>
    [colors[i % colors.length],
     `${truncate(d.key, 22)} — ${(d.v / total * 100).toFixed(1)}%`]));
}

/* -------------------------------------------------------------------- donut */

function viewDonut(root) {
  const p = parts(STATE.partsBy || 'county');
  if (!p) return root.append(partsUnavailable());

  const {shown} = foldTail(p.slices, 7);
  const total = p.slices.reduce((a, b) => a + b.v, 0);

  const c = card(`${p.title} — share of the total`, p.caption +
    ' A donut is only honest for a handful of parts, so everything past the ' +
    'seventh is folded into “Other”. For close comparisons use the ranked bars.');
  root.append(c.el);

  const W = Math.max(420, Math.min(720, root.clientWidth - 60));
  const H = 380;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);

  const R = Math.min(W, H) / 2 - 66, r0 = R * 0.58;
  const g = s('g', {transform: `translate(${W / 2},${H / 2})`});
  c.svg.append(g);

  const colors = categorical(shown.length);
  const pie = d3.pie().sort(null).value(d => d.v).padAngle(0.008)(shown);
  const arc = d3.arc().innerRadius(r0).outerRadius(R).cornerRadius(2);
  const label = d3.arc().innerRadius(R + 16).outerRadius(R + 16);

  pie.forEach((slice, i) => {
    const fill = colors[i % colors.length];
    const path = s('path', {d: arc(slice), fill,
      stroke: cssVar('--surface-1'), 'stroke-width': 2, style: {cursor: 'pointer'}});
    hoverable(path, () => tipHTML(slice.data.key, [
      ['Value', fmtFull(slice.data.v, p.unit)],
      ['Share', `${(slice.data.v / total * 100).toFixed(2)}%`],
    ]));
    g.append(path);
    const pct = slice.data.v / total * 100;
    if (pct >= 4) {
      const [lx, ly] = label.centroid(slice);
      g.append(s('text', {x: lx, y: ly, class: 'mark-label',
        'text-anchor': lx > 0 ? 'start' : 'end', 'dominant-baseline': 'middle',
        text: `${truncate(slice.data.key, 14)} ${pct.toFixed(0)}%`}));
    }
  });

  g.append(s('text', {y: -6, 'text-anchor': 'middle', class: 'title-text',
    'font-size': 20, text: fmtNumber(total, p.unit)}));
  g.append(s('text', {y: 13, 'text-anchor': 'middle', class: 'tick-text',
    text: p.unit || 'total'}));

  legendSwatches(c.legend, shown.map((d, i) =>
    [colors[i % colors.length],
     `${truncate(d.key, 20)} — ${(d.v / total * 100).toFixed(1)}%`]));
}

/* ---------------------------------------------------------- small multiples */

function viewSmallMultiples(root) {
  const sibs = siblingMetrics(STATE.metric).slice(0, 12);
  const useSibs = sibs.length >= 2;
  const items = useSibs ? sibs : [DB.metricById.get(STATE.metric)];

  const c = card(useSibs
      ? `${DB.metricById.get(STATE.metric).context} — one map per measure`
      : `${DB.metricById.get(STATE.metric).label} — by county`,
    useSibs
      ? `Every measure reported under the same heading, ${STATE.year}, each on ` +
        `its own scale so the pattern is comparable even when the totals aren't.`
      : `This measure has no siblings in its table, so there is only one map to draw. ` +
        `Pick a measure from a breakdown (a "by size" or "by value" group) to see a grid.`);
  root.append(c.el);

  const cols = items.length <= 2 ? 2 : items.length <= 6 ? 3 : 4;
  const cw = Math.max(170, Math.min(260, (root.clientWidth - 100) / cols));
  const chH = Math.round(cw * 0.66) + 34;
  const W = cols * cw, H = Math.ceil(items.length / cols) * chH;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('width', Math.min(W, root.clientWidth - 60));

  const active = new Set(activeNames());
  const {path} = ohioPath(cw - 12, chH - 42);

  items.forEach((m, k) => {
    const gx = (k % cols) * cw, gy = Math.floor(k / cols) * chH;
    const ser = series(m.id, STATE.year, STATE.mode);
    const vals = scopedValues(ser.values);
    const scale = makeClassScale(vals, {
      nClasses: 5, method: STATE.breakMode, ramp: STATE.ramp, reverse: STATE.reverse,
    });
    const g = s('g', {transform: `translate(${gx},${gy})`});
    g.append(s('text', {x: 6, y: 13, class: 'mark-label', 'font-weight': 600,
      text: truncate(m.label.replace(/\s*\([^)]*\)$/, ''), Math.floor(cw / 6.4))}));
    const inner = s('g', {transform: 'translate(6,20)'});
    for (const f of DB.geo.features) {
      const nm = f.properties.name, i = DB.byName.get(nm);
      const kk = scale.classOf(vals[i]);
      inner.append(hoverable(s('path', {
        d: path(f), fill: kk < 0 ? 'var(--grid)' : scale.colors[kk],
        stroke: cssVar('--surface-1'), 'stroke-width': 0.6,
        opacity: active.has(nm) ? 1 : 0.15,
      }), () => tipHTML(nm, [[m.label, fmtFull(vals[i], ser.unit)]])));
    }
    g.append(inner);
    g.append(s('text', {x: 6, y: chH - 8, class: 'tick-text',
      text: `${fmtNumber(scale.min, ser.unit)} – ${fmtNumber(scale.max, ser.unit)}`}));
    c.svg.append(g);
  });

  clear(c.legend).append(h('span', {class: 'hint',
    text: 'Each panel is scaled to its own range — read the pattern, not the shade, ' +
          'across panels. The range under each map gives its extremes.'}));
}

function partsUnavailable() {
  return h('div', {class: 'card'}, h('div', {class: 'empty'},
    STATE.delta
      ? 'Part-to-whole charts need levels, not changes. Turn off “Change 2017 → 2022”.'
      : 'This measure has no positive values to divide up in the current selection.'));
}

function describeSelection() {
  const n = activeCounties().length;
  return n === DB.counties.length ? 'all 88 counties' : `${n} selected counties`;
}


/* ============================================================================
   Analytical views: scatter (and its change-arrow form), concentration curve,
   county × measure heatmap, the Ohio time series, and the discovery tools.
   ========================================================================== */

/* ------------------------------------------------------------------ scatter */

function viewScatter(root) {
  if (!STATE.metric2) {
    root.append(h('div', {class: 'card'}, h('div', {class: 'empty'},
      'Pick a second measure in the sidebar to plot one against the other.')));
    return;
  }
  const a = series(STATE.metric, STATE.year, STATE.mode);
  const b = series(STATE.metric2, STATE.year, STATE.mode);
  const keep = activeCounties();
  const pts = keep.map(i => ({i, name: DB.counties[i].name, x: a.values[i], y: b.values[i]}))
    .filter(d => d.x != null && d.y != null);
  if (pts.length < 3) return root.append(emptySelection());

  const bothYears = DB.metricById.get(STATE.metric).years.length > 1 &&
                    DB.metricById.get(STATE.metric2).years.length > 1;
  const arrows = STATE.delta && bothYears;

  const r = correlation(pts.map(d => d.x), pts.map(d => d.y));
  const c = card(`${b.label}  vs  ${a.label}`,
    `${STATE.year}${arrows ? ' — with 2017 → 2022 movement' : ''}. ` +
