    (r != null
      ? `Correlation r = ${r.toFixed(2)} across ${pts.length} counties — ` +
        `${Math.abs(r) > 0.7 ? 'a strong' : Math.abs(r) > 0.4 ? 'a moderate' : 'a weak'} ` +
        `${r < 0 ? 'inverse ' : ''}relationship. Correlation is not causation; both may ` +
        `simply track how much farmland a county has.`
      : 'Too few overlapping counties to compute a correlation.'));
  root.append(c.el);

  const W = Math.max(520, Math.min(940, root.clientWidth - 72));
  const H = Math.round(W * 0.66);
  const padL = 68, padR = 24, padT = 22, padB = 56;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);

  const xs = pts.map(d => d.x), ys = pts.map(d => d.y);
  const x = linScale(Math.min(0, ...xs), Math.max(...xs), padL, W - padR);
  const y = linScale(Math.min(0, ...ys), Math.max(...ys), H - padB, padT);

  for (const t of niceTicks(x.domain[0], x.domain[1], 6)) {
    c.svg.append(s('line', {x1: x(t), x2: x(t), y1: padT, y2: H - padB, class: 'grid-line'}));
    c.svg.append(s('text', {x: x(t), y: H - padB + 16, class: 'tick-text',
      'text-anchor': 'middle', text: fmtNumber(t, a.unit)}));
  }
  for (const t of niceTicks(y.domain[0], y.domain[1], 5)) {
    c.svg.append(s('line', {x1: padL, x2: W - padR, y1: y(t), y2: y(t), class: 'grid-line'}));
    c.svg.append(s('text', {x: padL - 8, y: y(t) + 4, class: 'tick-text',
      'text-anchor': 'end', text: fmtNumber(t, b.unit)}));
  }
  c.svg.append(s('text', {x: (padL + W - padR) / 2, y: H - 12, class: 'mark-label',
    'text-anchor': 'middle', text: `${a.label} →`}));
  c.svg.append(s('text', {x: 14, y: (padT + H - padB) / 2, class: 'mark-label',
    'text-anchor': 'middle', transform: `rotate(-90,14,${(padT + H - padB) / 2})`,
    text: `${b.label} →`}));

  if (arrows) {
    const y0 = DB.metricById.get(STATE.metric).years[0];
    const a0 = series(STATE.metric, y0, STATE.mode).values;
    const b0 = series(STATE.metric2, y0, STATE.mode).values;
    const defs = s('defs');
    defs.append(s('marker', {id: 'arrow', viewBox: '0 0 8 8', refX: 6, refY: 4,
      markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse'},
      s('path', {d: 'M0,0 L8,4 L0,8 z', fill: cssVar('--series-1')})));
    c.svg.append(defs);
    for (const d of pts) {
      if (a0[d.i] == null || b0[d.i] == null) continue;
      c.svg.append(s('line', {
        x1: x(a0[d.i]), y1: y(b0[d.i]), x2: x(d.x), y2: y(d.y),
        stroke: cssVar('--series-1'), 'stroke-width': 1.4, opacity: 0.45,
        'marker-end': 'url(#arrow)',
      }));
    }
  }

  const col = cssVar('--series-1');
  for (const d of pts) {
    const dot = s('circle', {
      cx: x(d.x), cy: y(d.y), r: 5.5, fill: col,
      stroke: cssVar('--surface-1'), 'stroke-width': 2,
      opacity: STATE.focus && STATE.focus !== d.name ? 0.25 : 0.9,
      style: {cursor: 'pointer'},
    });
    hoverable(dot, () => tipHTML(d.name, [
      [a.label, fmtFull(d.x, a.unit)],
      [b.label, fmtFull(d.y, b.unit)],
    ]));
    dot.addEventListener('click', () => spotlight(d.name));
    c.svg.append(dot);
    if (STATE.showLabels)
      c.svg.append(s('text', {x: x(d.x) + 8, y: y(d.y) + 3, class: 'tick-text',
        'pointer-events': 'none', text: d.name}));
  }

  clear(c.legend).append(h('span', {class: 'hint',
    text: arrows ? 'Each arrow runs from the county’s 2017 position to its 2022 position.'
                 : 'Turn on “Change 2017 → 2022” to draw each county’s movement as an arrow.'}));
}

/* ------------------------------------------------------------ concentration */

function viewConcentration(root) {
  const ser = currentSeries();
  if (!ser || ser.isDelta)
    return root.append(h('div', {class: 'card'}, h('div', {class: 'empty'},
      'Concentration is measured on levels, not changes. Turn off “Change 2017 → 2022”.')));

  const keep = activeCounties();
  const vals = keep.map(i => ser.values[i]).filter(v => v != null && v >= 0)
    .sort((a, b) => a - b);
  if (vals.length < 4) return root.append(emptySelection());

  const total = vals.reduce((a, b) => a + b, 0);
  const g = gini(vals);
  const n = vals.length;

  const c = card(`How concentrated is ${ser.label}?`,
    `${subtitleFor(ser)}. The curve plots the share of the state total held by ` +
    `the smallest counties. The straight line is perfect equality — every county ` +
    `the same. The further the curve sags, the more of Ohio's total sits in a few places.`);
  root.append(c.el);

  const W = Math.max(420, Math.min(620, root.clientWidth - 60));
  const H = W, padL = 58, padR = 20, padT = 18, padB = 52;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);

  const x = linScale(0, 1, padL, W - padR);
  const y = linScale(0, 1, H - padB, padT);

  for (let t = 0; t <= 1.0001; t += 0.25) {
    c.svg.append(s('line', {x1: x(t), x2: x(t), y1: padT, y2: H - padB, class: 'grid-line'}));
    c.svg.append(s('line', {x1: padL, x2: W - padR, y1: y(t), y2: y(t), class: 'grid-line'}));
    c.svg.append(s('text', {x: x(t), y: H - padB + 16, class: 'tick-text',
      'text-anchor': 'middle', text: `${Math.round(t * 100)}%`}));
    c.svg.append(s('text', {x: padL - 8, y: y(t) + 4, class: 'tick-text',
      'text-anchor': 'end', text: `${Math.round(t * 100)}%`}));
  }

  c.svg.append(s('line', {x1: x(0), y1: y(0), x2: x(1), y2: y(1),
    stroke: cssVar('--axis'), 'stroke-width': 2}));

  const pts = [[0, 0]];
  let cum = 0;
  vals.forEach((v, i) => { cum += v; pts.push([(i + 1) / n, cum / total]); });

  const area = `M${x(0)},${y(0)} ` +
    pts.map(p => `L${x(p[0])},${y(p[1])}`).join(' ') +
    ` L${x(1)},${y(0)} Z`;
  c.svg.append(s('path', {d: area, fill: cssVar('--series-1'), opacity: 0.12}));
  c.svg.append(s('path', {
    d: 'M' + pts.map(p => `${x(p[0])},${y(p[1])}`).join(' L'),
    fill: 'none', stroke: cssVar('--series-1'), 'stroke-width': 2,
    'stroke-linejoin': 'round',
  }));

  // A few readable checkpoints instead of a dot on every county.
  for (const q of [0.5, 0.8, 0.9]) {
    const k = Math.round(q * n);
    const share = pts[k][1];
    const dot = s('circle', {cx: x(q), cy: y(share), r: 5,
      fill: cssVar('--series-1'), stroke: cssVar('--surface-1'), 'stroke-width': 2});
    hoverable(dot, () => tipHTML(`Smallest ${Math.round(q * 100)}% of counties`,
      [['Share of Ohio total', `${(share * 100).toFixed(1)}%`]]));
    c.svg.append(dot);
    c.svg.append(s('text', {x: x(q) + 8, y: y(share) + 14, class: 'tick-text',
      text: `${(share * 100).toFixed(0)}%`}));
  }

  c.svg.append(s('text', {x: (padL + W - padR) / 2, y: H - 12, class: 'mark-label',
    'text-anchor': 'middle', text: 'counties, smallest first →'}));
  c.svg.append(s('text', {x: 14, y: (padT + H - padB) / 2, class: 'mark-label',
    'text-anchor': 'middle', transform: `rotate(-90,14,${(padT + H - padB) / 2})`,
    text: 'share of the total →'}));

  const top10 = vals.slice(-Math.max(1, Math.round(n * 0.1)))
    .reduce((a, b) => a + b, 0) / total;
  root.append(h('div', {class: 'card'},
    h('div', {class: 'stat-row'},
      h('div', {class: 'stat'},
        h('span', {class: 'k', text: 'Gini coefficient'}),
        h('span', {class: 'v', text: g.toFixed(3)})),
      h('div', {class: 'stat'},
        h('span', {class: 'k', text: 'Held by the top 10% of counties'}),
        h('span', {class: 'v', text: `${(top10 * 100).toFixed(1)}%`})),
      h('div', {class: 'stat'},
        h('span', {class: 'k', text: 'Counties counted'}),
        h('span', {class: 'v', text: String(n)}))),
    h('p', {class: 'caption', style: {margin: '10px 0 0'},
      text: '0 would mean every county holds an identical amount; 1 would mean a ' +
            'single county holds all of it. Counties where the figure was withheld ' +
            'are left out, which nudges the measure down slightly.'})));

  clear(c.legend);
}

/* ------------------------------------------------------------------ heatmap */

function viewHeatmap(root) {
  const sibs = siblingMetrics(STATE.metric).slice(0, 16);
  if (sibs.length < 2)
    return root.append(h('div', {class: 'card'}, h('div', {class: 'empty'},
      'A heatmap needs several measures to compare. Pick one from a breakdown ' +
      'group — a "by size of farm" or "by value of sales" set, for instance.')));

  const keep = activeCounties();
  const cols = sibs.map(m => {
    const v = series(m.id, STATE.year, STATE.mode).values;
    const mu = mean(keep.map(i => v[i])), sd = stdev(keep.map(i => v[i]));
    return {m, v, mu, sd};
  });

  let order = keep.slice();
  order.sort((i, j) => {
    const av = cols[0].v[i], bv = cols[0].v[j];
    return (bv == null ? -Infinity : bv) - (av == null ? -Infinity : av);
  });

  const c = card(`${DB.metricById.get(STATE.metric).context} — county profile`,
    `Every county against every measure in the group, ${STATE.year}. Each column ` +
    `is standardised on its own (z-scores), so a row reads as a profile: which ` +
    `parts of this breakdown the county leans into, not how big it is overall.`);
  root.append(c.el);

  const cw = 46, rh = 15, padL = 104, padT = 96;
  const W = padL + cols.length * cw + 16;
  const H = padT + order.length * rh + 12;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('width', Math.min(W, root.clientWidth - 60));
  c.svg.setAttribute('height', H);

  const scale = makeClassScale([-2.5, 2.5], {
    nClasses: 7, diverging: true, divKey: STATE.divKey, reverse: STATE.reverse, center: 0,
  });

  cols.forEach((cd, k) => {
    const cx = padL + k * cw + cw / 2;
    c.svg.append(s('text', {
      x: cx, y: padT - 8, class: 'tick-text', 'text-anchor': 'start',
      transform: `rotate(-52,${cx},${padT - 8})`,
      text: truncate(cd.m.label.replace(/\s*\([^)]*\)$/, ''), 20),
    }));
  });

  order.forEach((i, r) => {
    const name = DB.counties[i].name;
    const yy = padT + r * rh;
    c.svg.append(s('text', {x: padL - 8, y: yy + rh - 4, class: 'mark-label',
      'text-anchor': 'end', text: truncate(name, 14)}));
    cols.forEach((cd, k) => {
      const raw = cd.v[i];
      const z = (raw == null || !cd.sd) ? null : (raw - cd.mu) / cd.sd;
      const kk = z == null ? -1 : scale.classOf(z);
      const rect = s('rect', {
        x: padL + k * cw + 1, y: yy + 1, width: cw - 2, height: rh - 2, rx: 2,
        fill: kk < 0 ? 'var(--grid)' : scale.colors[kk],
        style: {cursor: 'pointer'},
      });
      hoverable(rect, () => tipHTML(`${name} — ${cd.m.label}`, [
        ['Value', fmtFull(raw, cd.m.unit)],
        ['Z-score', z == null ? '—' : z.toFixed(2)],
      ], z == null ? 'Withheld or not reported.' : ''));
      c.svg.append(rect);
    });
  });

  legendClasses(c.legend, scale, 'z-score');
  c.legend.append(h('span', {class: 'hint',
    text: 'Rows sorted by the first column.'}));
}

/* -------------------------------------------------------- Ohio time series */

function viewHistory(root) {
  const picks = STATE.historyPicks && STATE.historyPicks.length
    ? STATE.historyPicks
    : ['Farms (number)', 'Land in farms (acres)'];
  const chosen = DB.history.filter(hh => picks.includes(hh.label));
  const list = chosen.length ? chosen : DB.history.slice(0, 2);

  const c = card('Ohio since 1997 — the long view',
    'The county tables only run 2017 and 2022. The state chapter of the same ' +
    'report carries a longer series, shown here on a common index (first ' +
    'available census = 100) so measures of very different size share one axis. ' +
    'Figures are the coverage-adjusted ones, so 1992 — published unadjusted only — ' +
    'is not included.');
  root.append(c.el);

  const W = Math.max(520, Math.min(1000, root.clientWidth - 72));
  const H = 380, padL = 54, padR = 108, padT = 24, padB = 44;
  c.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  c.svg.setAttribute('height', H);

  const years = [...new Set(list.flatMap(hh => Object.keys(hh.points)))]
    .map(Number).sort((a, b) => a - b);
  if (!years.length) return;

  const norm = list.map(hh => {
    const base = hh.points[String(years[0])] ??
      hh.points[Object.keys(hh.points).sort()[0]];
    return {
      label: hh.label,
      pts: years.map(y => {
        const v = hh.points[String(y)];
        return v == null || !base ? null : {y, v: v / base * 100, raw: v};
      }).filter(Boolean),
    };
  });

  const all = norm.flatMap(nn => nn.pts.map(p => p.v));
  const x = linScale(years[0], years[years.length - 1], padL, W - padR);
  const y = linScale(Math.min(80, ...all), Math.max(120, ...all), H - padB, padT);

  for (const t of niceTicks(y.domain[0], y.domain[1], 5)) {
    c.svg.append(s('line', {x1: padL, x2: W - padR, y1: y(t), y2: y(t), class: 'grid-line'}));
    c.svg.append(s('text', {x: padL - 8, y: y(t) + 4, class: 'tick-text',
      'text-anchor': 'end', text: String(Math.round(t))}));
  }
  c.svg.append(s('line', {x1: padL, x2: W - padR, y1: y(100), y2: y(100),
    stroke: cssVar('--axis'), 'stroke-width': 1.5}));
  for (const yr of years) {
    c.svg.append(s('text', {x: x(yr), y: H - padB + 17, class: 'tick-text',
      'text-anchor': 'middle', text: String(yr)}));
  }

  const colors = categorical(norm.length);
  norm.forEach((nn, i) => {
    const col = colors[i % colors.length];
    c.svg.append(s('path', {
      d: 'M' + nn.pts.map(p => `${x(p.y)},${y(p.v)}`).join(' L'),
      fill: 'none', stroke: col, 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
    nn.pts.forEach(p => {
      const dot = s('circle', {cx: x(p.y), cy: y(p.v), r: 4.5, fill: col,
        stroke: cssVar('--surface-1'), 'stroke-width': 2});
      hoverable(dot, () => tipHTML(`${nn.label} — ${p.y}`, [
        ['Value', p.raw.toLocaleString()],
        ['Index', `${p.v.toFixed(1)} (${years[0]} = 100)`],
      ]));
      c.svg.append(dot);
    });
    const last = nn.pts[nn.pts.length - 1];
    c.svg.append(s('text', {x: x(last.y) + 9, y: y(last.v) + 4, class: 'mark-label',
      fill: col, 'font-weight': 600,
      text: truncate(nn.label.replace(/\s*\([^)]*\)$/, ''), 16)}));
  });

  legendSwatches(c.legend, norm.map((nn, i) => [colors[i % colors.length], nn.label]));
  root.append(historyPicker());
}

function historyPicker() {
  const box = h('div', {class: 'card'},
    h('h2', {text: 'Series to plot'}),
    h('p', {class: 'caption',
      text: 'Up to eight at a time. These are Ohio-wide figures from the state ' +
            'chapter of the report.'}));
  const chips = h('div', {class: 'chips'});
  const picks = new Set(STATE.historyPicks || ['Farms (number)', 'Land in farms (acres)']);
  DB.history.forEach(hh => {
    const on = picks.has(hh.label);
    chips.append(h('button', {
      class: 'chip', 'aria-pressed': String(on), text: truncate(hh.label, 40),
      onclick: () => {
        if (picks.has(hh.label)) picks.delete(hh.label);
        else if (picks.size < 8) picks.add(hh.label);
        STATE.historyPicks = [...picks];
        render();
      },
    }));
  });
  box.append(chips);
  return box;
}

/* ---------------------------------------------------------------- discovery */

/**
 * Two questions the census can answer but no published table does:
 * which other measure maps like this one, and which county is this one's twin.
 */
function viewDiscover(root) {
  const base = series(STATE.metric, STATE.year, STATE.mode).values;
  const keep = new Set(activeCounties());
  const masked = base.map((v, i) => (keep.has(i) ? v : null));

  // --- correlates
  const scored = [];
  for (const m of DB.metrics) {
    if (m.id === STATE.metric) continue;
    if (!m.years.includes(STATE.year) || m.coverage < 40) continue;
    const v = series(m.id, STATE.year, STATE.mode).values;
    const r = correlation(masked, v.map((x, i) => (keep.has(i) ? x : null)));
    if (r != null && isFinite(r)) scored.push({m, r});
  }
  const withIt = [...scored].sort((a, b) => b.r - a.r).slice(0, 18);
  const againstIt = [...scored].sort((a, b) => a.r - b.r).slice(0, 18)
    .filter(d => d.r < 0);

  const cur = DB.metricById.get(STATE.metric);
  const c1 = card(`What else looks like ${cur.label}?`,
    `Every one of the ${DB.metrics.length.toLocaleString()} measures in this report, ` +
    `correlated across counties against the one you have selected (${STATE.year}, ` +
    `${MODE_BY_ID.get(STATE.mode).label.toLowerCase()}). An r near 1.000 usually means ` +
    `the census published the same figure in two tables, or that both measures simply ` +
    `track how much farmland a county has — the surprises are further down, and in the ` +
    `second column. Correlation across 88 counties is not evidence of cause.`);
  root.append(c1.el);
  c1.svg.remove();

  const table = (title, list, empty) => {
    const body = list.length
      ? h('tbody', {}, list.map(({m, r}) => {
          const tr = h('tr', {style: {cursor: 'pointer'},
            title: `${m.label} — ${m.context}`},
            h('td', {class: 'num', style: {color: r < 0 ? 'var(--bad)' : 'var(--good)',
              fontWeight: '600'}, text: r.toFixed(3)}),
            h('td', {text: truncate(m.label, 48)}),
            h('td', {style: {color: 'var(--text-muted)'}, text: truncate(m.context, 26)}));
          tr.addEventListener('click', () => {
            STATE.metric2 = m.id; STATE.view = 'scatter'; render();
          });
          return tr;
        }))
      : h('tbody', {}, h('tr', {}, h('td', {colspan: 3, class: 'hint', text: empty})));
    return h('div', {style: {flex: '1 1 380px', minWidth: '0'}},
      h('h2', {style: {fontSize: '12px', marginBottom: '6px'}, text: title}),
      h('div', {class: 'scroll-x'},
        h('table', {class: 'data'},
          h('thead', {}, h('tr', {},
            h('th', {text: 'r'}), h('th', {text: 'Measure'}), h('th', {text: 'From'}))),
          body)));
  };

  c1.el.append(h('div', {style: {display: 'flex', gap: '22px', flexWrap: 'wrap'}},
    table('Moves with it', withIt, ''),
    table('Moves against it', againstIt,
      'Nothing in the report moves inversely with this measure.')));
  c1.el.append(h('p', {class: 'caption', style: {margin: '12px 0 0'},
    text: 'Click any row to plot it against your measure on the scatter view.'}));

  // --- statistical twins
  const anchor = STATE.focus || DB.counties[0].name;
  const profile = twinProfile();
  const ai = DB.byName.get(anchor);
  const twins = DB.counties.map((cty, i) => {
    if (i === ai) return null;
    let sum = 0, n = 0;
    for (const p of profile) {
      const a = p.z[ai], b = p.z[i];
      if (a == null || b == null) continue;
      sum += (a - b) ** 2; n++;
    }
    return n >= 4 ? {name: cty.name, d: Math.sqrt(sum / n), n} : null;
  }).filter(Boolean).sort((a, b) => a.d - b.d);

  const c2 = card(`Counties most like ${anchor}`,
    `Distance across ${profile.length} standardised headline measures — farm ` +
    `count and size, land use, sales mix, livestock and expenses. Lower is more ` +
    `alike. Click a county on any map to re-anchor this list.`);
  root.append(c2.el);
  c2.svg.remove();

  const grid = h('div', {style: {display: 'flex', gap: '8px', flexWrap: 'wrap'}});
  twins.slice(0, 8).forEach((t, i) => {
    grid.append(h('button', {
      class: 'btn', style: {flexDirection: 'column', alignItems: 'flex-start',
        display: 'flex', gap: '2px', minWidth: '112px', padding: '9px 11px'},
      onclick: () => { STATE.focus = t.name; render(); },
    },
      h('span', {style: {fontWeight: '600', color: 'var(--text-primary)'}, text: t.name}),
      h('span', {class: 'hint', text: `distance ${t.d.toFixed(2)}`})));
  });
  c2.el.append(grid);

  const far = twins[twins.length - 1];
  if (far) c2.el.append(h('p', {class: 'caption', style: {margin: '12px 0 0'},
    text: `Least like ${anchor}: ${far.name} (distance ${far.d.toFixed(2)}).`}));
}

/** Standardised headline measures used for the twin comparison. */
function twinProfile() {
  const wanted = [
    'Farms (number)', 'Land in farms (acres)', 'Average size of farm (acres)',
    'Market value of agricultural products sold ($1,000)',
    'Crops, including nursery and greenhouse crops ($1,000)',
    'Livestock, poultry, and their products ($1,000)',
    'Total cropland (acres)', 'Harvested cropland (acres)',
    'Irrigated land (acres)', 'Total farm production expenses ($1,000)',
  ];
  const out = [];
  for (const label of wanted) {
    const m = DB.metrics.find(o => o.label === label && o.context.startsWith('County Summary'))
           || DB.metrics.find(o => o.label === label);
    if (!m) continue;
    const v = series(m.id, '2022', 'raw').values;
    const mu = mean(v), sd = stdev(v);
    if (!sd) continue;
    out.push({m, z: v.map(x => (x == null ? null : (x - mu) / sd))});
  }
  return out;
}


/* ============================================================================
   The table view — the accessible twin of every chart — and file export.
   ========================================================================== */

function viewTable(root) {
  const m = DB.metricById.get(STATE.metric);
  const years = m.years;
  const keep = activeCounties();

  const cols = [
    {k: 'name', label: 'County', num: false},
    ...years.map(y => ({k: y, label: y, num: true})),
  ];
  if (years.length > 1) {
    cols.push({k: 'chg', label: 'Change', num: true});
    cols.push({k: 'pct', label: '% change', num: true});
  }
  cols.push({k: 'rank', label: 'Rank', num: true});
  cols.push({k: 'share', label: '% of Ohio', num: true});

  const byYear = Object.fromEntries(years.map(y =>
    [y, series(STATE.metric, y, STATE.mode)]));
  const last = years[years.length - 1];
  const lastVals = byYear[last].values;
  const ranked = lastVals.map((v, i) => [v, i]).filter(d => d[0] != null)
    .sort((a, b) => b[0] - a[0]);
  const rankOf = new Map(ranked.map(([, i], k) => [i, k + 1]));
  const total = ohioValue(STATE.metric, last) ??
    finite(lastVals).reduce((a, b) => a + b, 0);

  let data = keep.map(i => {
    const row = {i, name: DB.counties[i].name};
    years.forEach(y => { row[y] = byYear[y].values[i]; });
    if (years.length > 1) {
      const a = row[years[0]], b = row[last];
      row.chg = (a == null || b == null) ? null : b - a;
      row.pct = (a == null || b == null || a === 0) ? null : (b - a) / Math.abs(a) * 100;
    }
    row.rank = rankOf.get(i) ?? null;
    row.share = (row[last] == null || !total) ? null : row[last] / total * 100;
    return row;
  });

  const sortKey = STATE.tableSort || last;
  const dir = STATE.tableDir ?? -1;
  data.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (sortKey === 'name') return a.name.localeCompare(b.name) * (dir < 0 ? -1 : 1);
    if (x == null) return 1;
    if (y == null) return -1;
    return (x - y) * dir;
  });

  const c = card(`${m.label} — every value`,
    `${m.context} · ${m.table} of the county chapter. ` +
    `${MODE_BY_ID.get(STATE.mode).label}. A dash means the census withheld the ` +
    `figure to avoid identifying an individual operation, or never collected it.`);
  c.svg.remove();
  root.append(c.el);

  const unit = byYear[last].unit;
  const thead = h('thead', {}, h('tr', {}, cols.map(col =>
    h('th', {
      class: col.num ? 'num' : '', style: col.num ? {textAlign: 'right'} : {},
      text: col.label + (sortKey === col.k ? (dir < 0 ? '  ↓' : '  ↑') : ''),
      onclick: () => {
        STATE.tableDir = STATE.tableSort === col.k ? -(STATE.tableDir ?? -1) : -1;
        STATE.tableSort = col.k;
        render();
      },
    }))));

  const tbody = h('tbody', {}, data.map(row => h('tr', {},
    cols.map(col => {
      if (col.k === 'name')
        return h('td', {}, h('button', {
          class: 'btn sm', style: {border: 0, background: 'none', padding: 0,
            color: STATE.focus === row.name ? 'var(--accent)' : 'inherit',
            fontWeight: STATE.focus === row.name ? '650' : '500'},
          text: row.name,
          onclick: () => { STATE.focus = row.name; render(); },
        }));
      const v = row[col.k];
      const txt = v == null ? '—'
        : col.k === 'pct' ? `${v >= 0 ? '+' : ''}${v.toFixed(1)}%`
        : col.k === 'share' ? `${v.toFixed(2)}%`
        : col.k === 'rank' ? String(v)
        : fmtNumber(v, unit);
      const style = {};
      if (col.k === 'pct' && v != null) style.color = v >= 0 ? 'var(--good)' : 'var(--bad)';
      return h('td', {class: 'num', style, text: txt});
    }))));

  c.el.append(h('div', {class: 'scroll-x', style: {maxHeight: '62vh', overflowY: 'auto'}},
    h('table', {class: 'data'}, thead, tbody)));

  const ohioRow = ohioValue(STATE.metric, last);
  if (ohioRow != null)
    c.el.append(h('p', {class: 'caption', style: {margin: '12px 0 0'},
      text: `Ohio total, ${last}: ${fmtFull(ohioRow, m.unit)}. ` +
        `Published county figures for this measure sum to ` +
        `${fmtNumber(finite(rawSeries(STATE.metric, last)).reduce((a, b) => a + b, 0), m.unit)}` +
        ` — any gap is withheld values.`}));
}

/* -------------------------------------------------------------------- export */

/** Inline the computed theme colours so the exported file stands alone. */
function standaloneSVG(svg) {
  const clone = svg.cloneNode(true);
  const cs = getComputedStyle(document.documentElement);
  const vars = ['--surface-1', '--text-primary', '--text-secondary', '--text-muted',
    '--grid', '--axis', '--series-1', '--series-2', '--series-3', '--series-4',
    '--series-5', '--series-6', '--series-7', '--series-8', '--good', '--bad'];
  const resolved = Object.fromEntries(vars.map(v => [v, cs.getPropertyValue(v).trim()]));

  clone.querySelectorAll('*').forEach(el => {
    for (const attr of ['fill', 'stroke']) {
      const val = el.getAttribute(attr);
      if (val && val.startsWith('var(')) {
        const key = val.slice(4, -1).trim().split(',')[0].trim();
        if (resolved[key]) el.setAttribute(attr, resolved[key]);
      }
    }
  });

  const box = svg.viewBox.baseVal;
  const w = box && box.width ? box.width : svg.clientWidth;
  const hh = box && box.height ? box.height : svg.clientHeight;
  clone.setAttribute('xmlns', SVG_NS);
  clone.setAttribute('width', w);
  clone.setAttribute('height', hh);
  clone.setAttribute('viewBox', `0 0 ${w} ${hh}`);

  const style = document.createElementNS(SVG_NS, 'style');
  style.textContent = `
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .tick-text { fill: ${resolved['--text-muted']}; font-size: 11px; }
    .mark-label { fill: ${resolved['--text-secondary']}; font-size: 11px; }
    .title-text { fill: ${resolved['--text-primary']}; font-size: 13px; font-weight: 600; }
    .grid-line { stroke: ${resolved['--grid']}; stroke-width: 1; }
    .axis-line { stroke: ${resolved['--axis']}; stroke-width: 1; }
    .geo-stroke { stroke: ${resolved['--surface-1']}; stroke-width: 1.2; }
  `;
  clone.insertBefore(style, clone.firstChild);

  const bg = document.createElementNS(SVG_NS, 'rect');
  bg.setAttribute('width', w); bg.setAttribute('height', hh);
  bg.setAttribute('fill', resolved['--surface-1']);
  clone.insertBefore(bg, style.nextSibling);

  return {markup: new XMLSerializer().serializeToString(clone), w, h: hh};
}

function firstChart() {
  return document.querySelector('#canvas svg.chart');
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = h('a', {href: url, download: filename});
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function exportName(ext) {
  const m = DB.metricById.get(STATE.metric);
  const slug = (m ? m.label : 'chart').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48);
  return `ohio-ag-${STATE.view}-${slug}.${ext}`;
}

function exportSVG() {
  const svg = firstChart();
  if (!svg) return toast('This view has no chart to export — try the CSV.');
  const {markup} = standaloneSVG(svg);
  download(new Blob([markup], {type: 'image/svg+xml;charset=utf-8'}), exportName('svg'));
}

function exportPNG(scale = 2) {
  const svg = firstChart();
  if (!svg) return toast('This view has no chart to export — try the CSV.');
  const {markup, w, h: hh} = standaloneSVG(svg);
  const img = new Image();
  const blob = new Blob([markup], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(hh * scale);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = cssVar('--surface-1');
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(b => {
      download(b, exportName('png'));
      URL.revokeObjectURL(url);
    }, 'image/png');
  };
  img.onerror = () => { toast('Could not rasterise this chart; the SVG export will work.');
    URL.revokeObjectURL(url); };
  img.src = url;
}

function exportCSV() {
  const m = DB.metricById.get(STATE.metric);
  const years = m.years;
  const keep = activeCounties();
  const head = ['county', 'fips', ...years.map(y => `${y}_${STATE.mode}`)];
  if (years.length > 1) head.push('change', 'pct_change');
  const lines = [head.join(',')];
  const byYear = Object.fromEntries(years.map(y => [y, series(STATE.metric, y, STATE.mode).values]));
  for (const i of keep) {
    const cty = DB.counties[i];
    const cells = [cty.name, cty.fips, ...years.map(y => byYear[y][i] ?? '')];
    if (years.length > 1) {
      const a = byYear[years[0]][i], b = byYear[years[years.length - 1]][i];
      cells.push(a == null || b == null ? '' : b - a);
      cells.push(a == null || b == null || a === 0 ? '' : ((b - a) / Math.abs(a) * 100).toFixed(3));
    }
    lines.push(cells.map(v => (typeof v === 'string' && v.includes(',') ? `"${v}"` : v)).join(','));
  }
  lines.push('');
  lines.push(`# ${m.label} — ${m.context} (${m.table}, county chapter)`);
  lines.push(`# ${DB.source}`);
  lines.push('# Blank = withheld by the census to avoid disclosing an individual operation.');
  download(new Blob([lines.join('\n')], {type: 'text/csv;charset=utf-8'}), exportName('csv'));
}

function toast(msg) {
  const t = h('div', {
    text: msg,
    style: {position: 'fixed', bottom: '20px', left: '50%', transform: 'translateX(-50%)',
      background: 'var(--panel)', color: 'var(--text-primary)', padding: '9px 14px',
      border: '1px solid var(--border-strong)', borderRadius: '8px', zIndex: '200',
      boxShadow: 'var(--shadow)', fontSize: '13px'},
  });
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}


/* ============================================================================
   Stories — one-click presets that open the explorer on a specific finding.

   Two kinds sit side by side:

     * curated cards, hand-picked for a county, whose numbers are still read
       live from the data so the prose can never drift from the figures;
     * generated cards, which work for any of the 88 counties by scanning every
       measure for the places that county stands out.

   Every card carries a state patch, so "Show me" lands you on the view that
   makes the claim checkable rather than asking you to take it on trust.
   ========================================================================== */

const STORY_COUNTY = () => STATE.storyCounty || STATE.focus || 'Montgomery';

/** Resolve a measure by label, preferring a given table context. */
function findMetric(label, ctx) {
  const exact = DB.metrics.filter(m => m.label === label);
  const pool = exact.length ? exact
    : DB.metrics.filter(m => m.label.startsWith(label));
  if (!pool.length) return null;
  return (ctx && pool.find(m => m.context.startsWith(ctx))) || pool[0];
}

/**
 * Everything a story needs to state a fact about one county and one measure:
 * the value, where it ranks, its share of the state, and how it moved.
 */
function facts(metric, county, year) {
  if (!metric) return null;
  const i = DB.byName.get(county);
  if (i == null) return null;
  const y = year && metric.years.includes(year) ? year
    : metric.years[metric.years.length - 1];
  const v = rawSeries(metric.id, y);
  const x = v[i];
  if (x == null) return null;
  const fin = finite(v);
  const sorted = [...fin].sort((a, b) => b - a);
  const total = fin.reduce((a, b) => a + b, 0);
  const out = {
    metric, county, year: y, value: x, reporting: fin.length,
    rank: sorted.indexOf(x) + 1,
    share: total ? x / total * 100 : null,
    ohio: ohioValue(metric.id, y) ?? total,
    unit: metric.unit,
  };
  if (metric.years.length > 1) {
    const y0 = metric.years[0];
    const a = rawSeries(metric.id, y0)[i];
    if (a != null && a !== 0) {
      out.from = a; out.fromYear = y0;
      out.pct = (x - a) / Math.abs(a) * 100;
    }
  }
  return out;
}

const ord = n => `${n}${['th', 'st', 'nd', 'rd'][(n % 100 - n % 10 !== 10) * (n % 10 < 4) * n % 10] || 'th'}`;

function rankPhrase(f) {
  return f.rank <= 3 ? `<strong>${ord(f.rank)} highest in Ohio</strong>`
    : `${ord(f.rank)} of the ${f.reporting} counties reporting it`;
}

/* -------------------------------------------------------- curated: by county */

/* ------------------------------------------------------ generated: any county */

/**
 * Is this value substantial enough to headline?
 *
 * The filters exist because "first in Ohio" is cheap: a measure only 32
 * counties report, or one resting on three farms, will hand almost any county
 * a number-one finish that says nothing about the place.
 */
function material(f) {
  if (f.reporting < 45) return false;          // thinly-reported measures
  if (f.metric.coverage < 45) return false;
  if (f.ohio < 500) return false;              // trivial statewide totals
  const countLike = /farm|number|producer|operation|colonies|head|worker/i.test(f.unit || '');
  return countLike ? f.value >= 12 : f.value > 0;
}

/** Scan every measure for the ones where this county stands out. */
function generatedStories(county) {
  const i = DB.byName.get(county);
  const farmsId = ANCHOR.farms;
  const farms = farmsId ? rawSeries(farmsId, '2022') : null;
  const farmShare = farms && farms[i] ? farms[i] / finite(farms).reduce((a, b) => a + b, 0) : null;

  const topRanks = [], special = [], movers = [];

  for (const m of DB.metrics) {
    if (m.coverage < 30) continue;
    const f = facts(m, county, '2022');
    if (!f || !material(f)) continue;

    // A high rank only means something if the county also holds a real share;
    // otherwise fifth place is just a big county being big.
    if (f.rank <= 5 && f.share >= 6) topRanks.push(f);
    if (farmShare && f.share != null && f.share >= 3) {
      const lq = (f.share / 100) / farmShare;
      if (lq >= 2.5) special.push({...f, lq});
    }
    if (f.pct != null && Math.abs(f.pct) >= 40 && f.value >= 100 && f.from >= 50)
      movers.push(f);
  }

  topRanks.sort((a, b) => a.rank - b.rank || b.share - a.share);
  special.sort((a, b) => b.lq - a.lq);
  movers.sort((a, b) => Math.abs(b.pct) - Math.abs(a.pct));

  // One card per measure, and one per underlying figure: the census prints the
  // same count under several headings ("Beets, total harvested" and "Beets,
  // fresh market" are the same twelve farms), which would otherwise fill the
  // section with restatements of one fact.
  const used = new Set(), seenValue = new Set();
  const take = (list, n) => list.filter(f => {
    const vk = `${Math.round(f.value)}|${f.rank}|${f.unit}`;
    const lk = f.metric.label.slice(0, 44);
    if (used.has(f.metric.id) || seenValue.has(vk) || seenValue.has(lk)) return false;
    used.add(f.metric.id);
    seenValue.add(vk);
    seenValue.add(lk);
    return true;
  }).slice(0, n);

  return {
    topRanks: take(topRanks, 6),
    special: take(special, 6),
    movers: take(movers, 6),
  };
}

/* -------------------------------------------------------------- the view */

function viewStories(root) {
  const county = STORY_COUNTY();

  root.append(storyPicker(county));

  const summary = countySummary(county);
  if (summary) root.append(summary);

  const curated = CURATED[county] || [];
  if (curated.length) {
    root.append(h('h2', {style: {margin: '6px 2px 0', fontSize: '13px'},
      text: `Hand-picked findings for ${county}`}));
    const grid = h('div', {style: {display: 'grid', gap: '14px',
      gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))'}});
    for (const st of curated) {
      const f = facts(findMetric(st.metric[0], st.metric[1]), county, '2022');
      const g = st.also ? facts(findMetric(st.also[0], st.also[1]), county, '2022') : null;
      if (!f || (st.also && !g)) continue;
      grid.append(storyCard({
        tag: st.tag, title: st.title, body: st.tell(f, g),
        source: `${f.metric.context} · ${f.metric.table}`,
        patch: st.go(f, g),
      }));
    }
    root.append(grid);
  }

  const gen = generatedStories(county);
  const sections = [
    ['Where it leads Ohio', gen.topRanks,
     f => `${rankPhrase(f)} for <strong>${esc(f.metric.label)}</strong> — ` +
          `${f.unit === '$1,000' ? fmtMoney(f.value) : fmtFull(f.value, f.unit)}, ` +
          `${f.share.toFixed(1)}% of the state total.`,
     f => ({view: 'rank', metric: f.metric.id, year: f.year, mode: 'raw', topN: 15})],
    ['Where it punches above its weight', gen.special,
     f => `Holds ${f.share.toFixed(1)}% of Ohio's <strong>${esc(f.metric.label)}</strong> ` +
          `with only ${(100 * (rawSeries(ANCHOR.farms, '2022')[DB.byName.get(county)] /
            finite(rawSeries(ANCHOR.farms, '2022')).reduce((a, b) => a + b, 0))).toFixed(1)}% ` +
          `of the state's farms — a location quotient of ${f.lq.toFixed(1)}.`,
     f => ({view: 'map', metric: f.metric.id, year: f.year, mode: 'lq'})],
    ['What moved most since 2017', gen.movers,
     f => `<strong>${esc(f.metric.label)}</strong> went from ` +
          `${f.unit === '$1,000' ? fmtMoney(f.from) : fmtNumber(f.from, f.unit)} to ` +
          `${f.unit === '$1,000' ? fmtMoney(f.value) : fmtNumber(f.value, f.unit)} — ` +
          `${f.pct >= 0 ? '+' : ''}${f.pct.toFixed(0)}%.`,
     f => ({view: 'change', metric: f.metric.id, mode: 'raw', delta: true, topN: 20})],
  ];

  for (const [title, list, tell, go] of sections) {
    if (!list.length) continue;
    root.append(h('h2', {style: {margin: '10px 2px 0', fontSize: '13px'}, text: title}));
    const grid = h('div', {style: {display: 'grid', gap: '14px',
      gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))'}});
    for (const f of list) {
      grid.append(storyCard({
        tag: f.metric.topic, title: truncate(f.metric.label, 62), body: tell(f),
        source: `${f.metric.context} · ${f.metric.table}`, patch: go(f),
      }));
    }
    root.append(grid);
  }

  root.append(h('div', {class: 'card'},
    h('p', {class: 'caption', style: {margin: 0},
      text: 'Generated cards are found by scanning every measure in the report for the ones ' +
        'where this county ranks high, holds a share out of proportion to its farm count, or ' +
        'moved sharply between the two censuses. Measures reported by fewer than 30 counties, ' +
        'and county figures under 10 farms, are excluded — with counts that small a single ' +
        'operation moves the ranking. Nothing here is adjusted for the fact that a county with ' +
        'more farmland will lead on more measures; the "punches above its weight" section is ' +
        'the one that controls for size.'})));
}

function storyCard({tag, title, body, source, patch}) {
  return h('div', {class: 'card', style: {display: 'flex', flexDirection: 'column', gap: '8px'}},
    h('span', {style: {fontSize: '10px', letterSpacing: '.07em', textTransform: 'uppercase',
      color: 'var(--accent)', fontWeight: '650'}, text: tag}),
    h('h2', {style: {margin: 0, fontSize: '14.5px', lineHeight: '1.35'}, text: title}),

function metricPicker(key, label, clearable) {
  const cur = DB.metricById.get(STATE[key]);
  const box = h('div', {class: 'picker'});
  const btn = h('button', {class: 'current'},
    h('span', {class: 'lab', text: cur ? cur.label : 'Choose a measure…'}),
    h('span', {class: 'ctx', text: cur ? `${cur.context} · ${cur.table}` : ''}));
  const field = h('label', {class: 'field'}, h('span', {text: label}), box);
  box.append(btn);

  let panel = null;
  const close = () => { if (panel) { panel.remove(); panel = null; } };

  btn.addEventListener('click', () => {
    if (panel) return close();
    panel = h('div', {class: 'results'});
    const input = h('input', {type: 'search', placeholder: 'Search measures…',
      style: {marginBottom: '5px'}});
    const list = h('div');
    panel.append(input, list);
    box.append(panel);
    input.focus();

    const paint = q => {
      clear(list);
      const hits = searchMetrics(q, key === 'metric2');
      if (!hits.length) {
        list.append(h('div', {class: 'hint', style: {padding: '10px'},
          text: 'Nothing matches. Try a crop, an animal, or a dollar amount.'}));
        return;
      }
      let topic = null;
      for (const m of hits.slice(0, 120)) {
        if (m.topic !== topic) {
          topic = m.topic;
          list.append(h('div', {class: 'head', text: topic}));
        }
        list.append(h('div', {class: 'opt', onclick: () => {
          STATE[key] = m.id;
          close();
          render();
        }},
          h('div', {class: 'lab', text: m.label}),
          h('div', {class: 'ctx',
            text: `${m.context} · ${m.table} · ${m.years.join('/')} · ${m.coverage}/88 counties`})));
      }
      if (hits.length > 120)
        list.append(h('div', {class: 'hint', style: {padding: '8px'},
          text: `…and ${hits.length - 120} more. Keep typing to narrow it down.`}));
    };
    paint('');
    input.addEventListener('input', () => paint(input.value));
    setTimeout(() => document.addEventListener('click', function once(e) {
      if (panel && !box.contains(e.target)) { close(); document.removeEventListener('click', once); }
    }), 0);
  });

  if (clearable && cur) {
    field.append(h('button', {class: 'btn sm', text: 'Clear comparison',
      onclick: () => { STATE[key] = null; render(); }}));
  }
  return field;
}

function searchMetrics(q, allowAny) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const pool = DB.metrics;
  if (!terms.length) {
    // Lead with the headline table so the first thing offered is meaningful.
    const head = pool.filter(m => m.table === 'Table 1');
    return [...head, ...pool.filter(m => m.table !== 'Table 1')];
  }
  const scored = [];
  for (const m of pool) {
    const hay = `${m.label} ${m.context} ${m.topic} ${m.table}`.toLowerCase();
    if (!terms.every(t => hay.includes(t))) continue;
    let score = m.coverage;
    if (m.label.toLowerCase().startsWith(terms[0])) score += 200;
    if (m.table === 'Table 1') score += 60;
    if (m.years.length > 1) score += 40;
    scored.push({m, score});
  }
  scored.sort((a, b) => b.score - a.score);
  return scored.map(d => d.m);
}

function groupCounties() {
  const sel = STATE.selected;

  const search = h('input', {type: 'search', placeholder: 'Filter the list…'});
  const list = h('div', {class: 'county-list'});

  const paint = () => {
    clear(list);
    const q = search.value.toLowerCase();
    DB.counties.forEach((cty, i) => {
      if (q && !cty.name.toLowerCase().includes(q)) return;
      const on = !sel || sel.size === 0 ? !STATE.exclude : sel.has(cty.name);
      const row = h('label', {class: 'cty'},

        ser ? h('span', {class: 'v', text: fmtNumber(ser.values[i], ser.unit)}) : null);
      list.append(row);
    });
  };
  paint();
  search.addEventListener('input', paint);

  const presetChips = h('div', {class: 'chips'});
  const presets = {
    'All 88': null,
    ...DB.presets,
    'Top 10 here': topNames(10),
    'Bottom 10 here': topNames(10, true),
    ...STATE.collections,
  };
  for (const [name, names] of Object.entries(presets)) {
    presetChips.append(h('button', {class: 'chip', text: name, onclick: () => {
      STATE.selected = names ? new Set(names) : null;
      STATE.exclude = false;
      render();
    }}));
  }

  return group('Counties', false,
    h('div', {class: 'row'},
      h('span', {class: 'hint', style: {flex: '1'},
        text: `${n} of ${DB.counties.length} in play` +
              (STATE.exclude && sel && sel.size ? ` (${sel.size} excluded)` : '')}),
      h('button', {class: 'btn sm', text: 'Reset',
        onclick: () => { STATE.selected = null; STATE.exclude = false; render(); }})),
    segmented([{id: 'in', label: 'Keep only these'}, {id: 'out', label: 'Leave these out'}],
      STATE.exclude ? 'out' : 'in',
      v => { STATE.exclude = v === 'out'; render(); }),
    presetChips,
    search, list,
    h('div', {class: 'row'},
      h('button', {class: 'btn sm', text: 'Select all', onclick: () => {
        STATE.selected = new Set(DB.counties.map(c => c.name)); STATE.exclude = false; render();
      }}),
      h('button', {class: 'btn sm', text: 'Invert', onclick: () => {
        const cur = new Set(activeNames());
        STATE.selected = new Set(DB.counties.map(c => c.name).filter(nn => !cur.has(nn)));
        STATE.exclude = false; render();
      }}),
      h('button', {class: 'btn sm', text: 'Save as collection…', onclick: saveCollection})),
    Object.keys(STATE.collections).length
      ? h('p', {class: 'hint', text: 'Saved collections appear as chips above. ' +
          'Shift-click a chip to delete it.'}) : null);
}

function topNames(k, bottom) {
  if (!STATE.metric) return [];
  const ser = series(STATE.metric, STATE.year, STATE.mode);
  const idx = ser.values.map((v, i) => [v, i]).filter(d => d[0] != null)
    .sort((a, b) => bottom ? a[0] - b[0] : b[0] - a[0]);
  return idx.slice(0, k).map(d => DB.counties[d[1]].name);
}

function toggleCounty(name, fromList) {
  if (!STATE.selected) STATE.selected = new Set(fromList ? [] : activeNames());
  const sel = STATE.selected;
  if (sel.has(name)) sel.delete(name); else sel.add(name);
  if (sel.size === 0) STATE.selected = null;
  STATE.focus = name;
  render();
}

function saveCollection() {
  const names = activeNames();
  if (!names.length) return toast('Nothing selected to save.');
  const name = prompt(`Name this collection of ${names.length} counties:`);
  if (!name) return;
  STATE.collections[name] = names;
  saveState();
  render();
}

/** Some views describe measures rather than counties; they choose their own split. */
const PARTS_VIEWS = new Set(['treemap', 'waffle', 'donut']);

let rafToken = null;

function render() {
  if (rafToken) cancelAnimationFrame(rafToken);
  rafToken = requestAnimationFrame(() => {
    rafToken = null;
    try {
      paintViewbar();
      buildSidebar($('#sidebar'));
      const canvas = clear($('#canvas'));
      const view = VIEWS.find(v => v.id === STATE.view) || VIEWS[0];
      if (PARTS_VIEWS.has(view.id)) canvas.append(partsToggle());
      view.fn(canvas);
      canvas.append(sourceFooter());
    } catch (err) {
      console.error(err);
      clear($('#canvas')).append(h('div', {class: 'card'},
        h('div', {class: 'empty'},
          'That combination could not be drawn.', h('br'),
          h('span', {class: 'hint', text: String(err && err.message || err)}))));
    }
    writeHash();
  });
}

/* -------------------------------------------------------------- URL sharing */

const HASH_KEYS = ['view', 'metric', 'metric2', 'year', 'mode', 'delta', 'deltaPct',
  'ramp', 'diverging', 'divKey', 'reverse', 'nClasses', 'breakMode', 'exclude',
  'showLabels', 'sortBy', 'topN', 'partsBy', 'focus', 'storyCounty'];

function writeHash() {
  const o = {};
  for (const k of HASH_KEYS) if (STATE[k] != null && STATE[k] !== false) o[k] = STATE[k];
  if (STATE.selected && STATE.selected.size) o.sel = [...STATE.selected].join('|');
  const q = new URLSearchParams(o).toString();
  history.replaceState(null, '', `#${q}`);
}

function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (![...q].length) return;
  for (const k of HASH_KEYS) {
    if (!q.has(k)) continue;
    const raw = q.get(k);
    STATE[k] = raw === 'true' ? true : raw === 'false' ? false
      : /^-?\d+$/.test(raw) ? +raw : raw;
  }
  if (q.has('sel')) STATE.selected = new Set(q.get('sel').split('|'));
}

function buildShell() {
  document.body.append(
    h('div', {id: 'app'},
      h('header', {},
        h('div', {class: 'brand'},
          h('h1', {text: 'Ohio Agriculture Explorer'}),
          h('span', {class: 'sub', text: '2022 Census of Agriculture · 88 counties'})),
        h('div', {class: 'head-spacer'}),
        h('div', {class: 'head-actions'},
          h('button', {class: 'btn', text: 'SVG', title: 'Download the current chart as SVG',
            onclick: exportSVG}),
          h('button', {class: 'btn', text: 'PNG', title: 'Download the current chart as a 2× PNG',
            onclick: () => exportPNG(2)}),
          h('button', {class: 'btn', text: 'CSV', title: 'Download the data behind this view',
            onclick: exportCSV}),
          h('button', {class: 'btn', id: 'themeBtn', text: 'Theme',
            title: 'Switch between light and dark',
            onclick: () => {
              const el = document.documentElement;
              el.dataset.theme = el.dataset.theme === 'dark' ? 'light' : 'dark';
              saveState();
              render();
            }}))),
      h('aside', {id: 'sidebar'}),

        h('div', {class: 'viewbar', id: 'viewbar', role: 'tablist'}),
        h('div', {class: 'canvas-wrap', id: 'canvas'}))),
    h('div', {id: 'tooltip'}));
}

async function boot() {
  loadState();
  if (!document.documentElement.dataset.theme) {
    document.documentElement.dataset.theme =
      matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  buildShell();

  let payload;
  try {
    payload = await loadPayload();
  } catch (err) {
    $('#canvas').append(h('div', {class: 'card'}, h('div', {class: 'empty'},
      'Could not unpack the embedded data.', h('br'),
      h('span', {class: 'hint', text: String(err.message || err)}), h('br'),
      h('span', {class: 'hint',
        text: 'This page needs a browser with DecompressionStream — Chrome 80+, ' +
              'Safari 16.4+, or Firefox 113+.'}))));
    return;
  }

  initDB(payload);

  // Open on a measure that carries both censuses, so every view — the change
  // and slope ones included — has something to draw on first load.
  const pick = (label, ctx) => DB.metrics.find(m =>
    m.label === label && m.years.length > 1 && (!ctx || m.context.startsWith(ctx)));
  const first = pick('Total sales ($1,000)') ||
    pick('Land in farms (acres)', 'Farms, Land in Farms') ||
    DB.metrics.find(m => m.years.length > 1 && m.coverage >= 88) ||
    DB.metrics[0];
  STATE.metric = first.id;
  STATE.year = first.years[first.years.length - 1];
  const cmp = pick('Farms (number)', 'Farms, Land in Farms');
  if (cmp && cmp.id !== first.id) STATE.metric2 = cmp.id;

  readHash();
  if (!DB.metricById.has(STATE.metric)) STATE.metric = first.id;
  if (STATE.metric2 && !DB.metricById.has(STATE.metric2)) STATE.metric2 = null;

  render();
  window.addEventListener('resize', debounce(render, 220));
  window.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    const i = VIEWS.findIndex(v => v.id === STATE.view);
    if (e.key === '[') { STATE.view = VIEWS[(i - 1 + VIEWS.length) % VIEWS.length].id; render(); }
    if (e.key === ']') { STATE.view = VIEWS[(i + 1) % VIEWS.length].id; render(); }
  });
}

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

/** The payload rides along as gzipped base64 so the page stays a single file. */
async function loadPayload() {
  const b64 = document.getElementById('payload').textContent.trim();
  const bin = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
  if (typeof DecompressionStream !== 'function')
    throw new Error('DecompressionStream is not available in this browser');
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}

document.addEventListener('DOMContentLoaded', boot);

</script>
